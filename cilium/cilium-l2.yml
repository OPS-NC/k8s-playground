# cilium-l2.yml — the lab's "cloud provider": a range of IPs for `type: LoadBalancer`
# Services + the ARP announcement that makes them reachable from the host.
#
# The values written here are the lab DEFAULTS. `cilium/cilium-up.sh` substitutes them on the
# fly: the range comes from `LB_POOL_START`/`LB_POOL_END` (lab.env) and the interface name
# from `HOSTONLY_IF` (_out/cluster.env, DETECTED inside the VM).
---
apiVersion: "cilium.io/v2"
kind: CiliumLoadBalancerIPPool
metadata:
  name: lb-pool-56
spec:
  blocks:
  - start: "192.168.56.200"
    stop:  "192.168.56.230"
---
apiVersion: "cilium.io/v2alpha1"
kind: CiliumL2AnnouncementPolicy
metadata:
  name: l2-lb-workers
spec:
  # announce the IPs of type LoadBalancer Services
  loadBalancerIPs: true
  # no announcement from the control plane
  # ⚠️ with WORKERS=0 this selector keeps NO node: nobody announces any more and the Gateway
  #    Service stays unreachable. Remove the nodeSelector in that case.
  nodeSelector:
    matchExpressions:
    - key: node-role.kubernetes.io/control-plane
      operator: DoesNotExist
  # Announce on the host-only interface only — NEVER the NAT card `eth0`/`enp0s3`
  # (10.0.2.15, the same address on every VM): the host does not see it.
  # The name is substituted by cilium-up.sh from HOSTONLY_IF.
  interfaces:
  - ^enp0s8$
