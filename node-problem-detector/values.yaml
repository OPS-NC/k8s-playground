# values.yaml — node-problem-detector (deliveryhero chart) tuned for the Talos / kubeadm labs.
#
# NPD is a DaemonSet that watches NODE HEALTH and surfaces problems as NodeConditions + Events
# (KernelDeadlock, ReadonlyFilesystem, OOM, TaskHung, KernelOops, FS/IO errors...). Useful
# here: that is exactly the kind of failure that once froze cp2.
#
# Adaptation (valid for BOTH distributions): we keep ONLY the kernel-monitor (reading
# /dev/kmsg).
#   - docker-monitor (loaded by default by the chart) talks to the Docker socket: the runtime
#     of both labs is containerd, there is no Docker → the monitor fails.
#   - systemd-monitor reads journald:
#       Talos  : there is NEITHER systemd NOR journald → impossible, full stop;
#       kubeadm: systemd does exist on Debian 13, but Debian keeps the journal VOLATILE
#         (/run/log/journal) until /var/log/journal is created, while the chart only mounts
#         /var/log → the monitor would see nothing. To enable it: create /var/log/journal on
#         the nodes (`vagrant ssh`, mkdir + systemctl restart systemd-journald) THEN add
#         /config/systemd-monitor.json below.
settings:
  log_monitors:
    - /config/kernel-monitor.json      # kmsg -> detects OOM / TaskHung / KernelOops / Ext4/IO errors
  custom_monitors: []

# NPD runs privileged (/dev/kmsg access). The namespace is labelled PodSecurity `privileged`
# by node-problem-detector-up.sh: MANDATORY on Talos (cluster default `baseline`),
# documentation of intent on kubeadm (no level enforced by default).
securityContext:
  privileged: true

# Tolerates every NoSchedule taint => runs on the control planes TOO (watches cp1/2/3).
tolerations:
  - effect: NoSchedule
    operator: Exists

# Prometheus metrics exposed (port 20257). ServiceMonitor OFF until the observability add-on
# brings its Prometheus-Operator CRDs; switch it to true afterwards.
metrics:
  enabled: true
  serviceMonitor:
    enabled: false
