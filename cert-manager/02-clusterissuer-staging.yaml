# Let's Encrypt STAGING ACME issuer (Cloudflare DNS-01).
# Certificates NOT trusted by browsers, but very generous quotas: use it FIRST to validate the
# DNS-01 chain without burning the production quotas.
# `email`, `dnsZones` and the domain are NEUTRAL (public repository): platform-up.sh
# substitutes them from lab.env (LAB_ACME_EMAIL, LAB_DNS_ZONE, LAB_DOMAIN).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: admin@example.io
    privateKeySecretRef:
      name: letsencrypt-staging-account-key   # ACME account key (created by cert-manager)
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token       # see 01-cloudflare-api-token
              key: api-token
        selector:
          dnsZones:
            - example.io                           # Cloudflare zone hosting *.lab.example.io
