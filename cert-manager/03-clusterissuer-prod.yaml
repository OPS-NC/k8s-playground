# Let's Encrypt PRODUCTION ACME issuer (Cloudflare DNS-01).
# Publicly trusted certificates. Only switch here AFTER validating on staging (prod quotas are
# limited: ~5 identical certs / week).
# `email`, `dnsZones` and the domain are NEUTRAL (public repository): platform-up.sh
# substitutes them from lab.env (LAB_ACME_EMAIL, LAB_DNS_ZONE, LAB_DOMAIN).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@example.io
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
        selector:
          dnsZones:
            - example.io
