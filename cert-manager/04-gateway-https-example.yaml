# The `main-gateway` Gateway WITH a wildcard HTTPS listener + cert-manager integration.
#
# TO BE MERGED into envoy-gateway/Envoy-Proxy.yml (the Gateway block), or applied as is (it
# REPLACES the existing Gateway — same name/namespace).
#
# How it works (requires cert-manager installed with config.enableGatewayAPI=true):
#   1. cert-manager sees the annotation + the TLS listener with a certificateRefs.
#   2. It creates a Certificate for *.lab.example.io (dnsNames derived from the `hostname`).
#   3. It solves it over Cloudflare DNS-01 and fills the `wildcard-lab-example-io-tls` Secret.
#   4. Envoy serves that cert on :443.
#
# The Secret and the Certificate are created in the Gateway's namespace (here
# `envoy-gateway-system`).
#
# NEUTRAL domain (public repository): `lab.example.io`. The lab's real Gateway
# (`../envoy-gateway/Envoy-Proxy.yml`) receives `LAB_DOMAIN` through platform-up.sh; THIS file
# is an EXAMPLE that is never applied — if you use it, substitute the hostname AND the Secret
# name (`wildcard-<dashed-domain>-tls`) yourself.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: main-gateway
  namespace: envoy-gateway-system
  annotations:
    # letsencrypt-staging (the lab default) to iterate, letsencrypt-prod for a trusted cert.
    # ⚠️ prod = 5 certificates/week max for the same wildcard, and every `vagrant destroy`
    # burns one (the wildcard only lives in etcd). See LAB_ACME_ISSUER in lab.env.example.
    cert-manager.io/cluster-issuer: letsencrypt-staging
spec:
  gatewayClassName: envoy
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.lab.example.io"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: wildcard-lab-example-io-tls     # filled automatically by cert-manager
      allowedRoutes:
        namespaces:
          from: All
