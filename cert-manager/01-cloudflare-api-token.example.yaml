# Cloudflare API token for the ACME DNS-01 solver (creates/deletes the
# _acme-challenge.lab.example.io TXT records for the duration of the Let's Encrypt validation).
#
# ⚠️ DO NOT commit the REAL token. Two options:
#   1. (recommended) create the secret without a file:
#        kubectl create secret generic cloudflare-api-token \
#          -n cert-manager --from-literal=api-token='<YOUR_TOKEN>'
#   2. copy this file to 01-cloudflare-api-token.yaml (to be gitignored) and fill it in.
#
# The secret MUST be in the `cert-manager` namespace: a ClusterIssuer reads its secrets in the
# controller's namespace (--cluster-resource-namespace, default cert-manager).
#
# Token permissions (Cloudflare > My Profile > API Tokens > Create Token):
#   - Zone / DNS / Edit
#   - Zone / Zone / Read
#   scoped to the `example.io` zone.
apiVersion: v1
kind: Secret
metadata:
  name: cloudflare-api-token
  namespace: cert-manager
type: Opaque
stringData:
  api-token: "<PASTE_YOUR_CLOUDFLARE_TOKEN_HERE>"
