# WordPress + MariaDB — a Longhorn persistent-storage demo, exposed through Envoy Gateway.
#
# - 2 volumes Longhorn de 2Gi (RWO) : /var/lib/mysql (MariaDB) et /var/www/html (WordPress).
# - Recreate strategy (single-attach RWO volumes: the old pod releases before the new one).
# - Exposed over HTTPS at wordpress.lab.example.io (the *.lab.example.io wildcard cert).
#   NEUTRAL domain (public repository), applied BY HAND: edit the HTTPRoute hostname AND
#   WP_HOME/WP_SITEURL, ou `sed 's/lab\.example\.io/<ton-domaine>/g' … | kubectl apply -f -`.
#
# ⚠️ Example passwords (lab). DO NOT reuse them as they are outside a demo.
---
apiVersion: v1
kind: Namespace
metadata:
  name: wordpress-test
---
apiVersion: v1
kind: Secret
metadata:
  name: mariadb
  namespace: wordpress-test
type: Opaque
stringData:
  MARIADB_ROOT_PASSWORD: changeme-root-lab
  MARIADB_DATABASE: wordpress
  MARIADB_USER: wordpress
  MARIADB_PASSWORD: changeme-wp-lab
---
# ---------- MariaDB ----------
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mariadb-data
  namespace: wordpress-test
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: longhorn
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mariadb
  namespace: wordpress-test
  labels: { app: mariadb }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: mariadb }
  template:
    metadata:
      labels: { app: mariadb }
    spec:
      containers:
        - name: mariadb
          image: mariadb:11.8
          envFrom:
            - secretRef: { name: mariadb }
          ports:
            - { name: mysql, containerPort: 3306 }
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
              subPath: mysql          # its own subfolder (avoids the volume's lost+found)
          readinessProbe:
            exec: { command: ["healthcheck.sh", "--connect", "--innodb_initialized"] }
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            exec: { command: ["healthcheck.sh", "--connect", "--innodb_initialized"] }
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 640Mi }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: mariadb-data }
---
apiVersion: v1
kind: Service
metadata:
  name: mariadb
  namespace: wordpress-test
spec:
  selector: { app: mariadb }
  ports:
    - { name: mysql, port: 3306, targetPort: 3306 }
---
# ---------- WordPress ----------
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wordpress-data
  namespace: wordpress-test
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: longhorn
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpress
  namespace: wordpress-test
  labels: { app: wordpress }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: wordpress }
  template:
    metadata:
      labels: { app: wordpress }
    spec:
      containers:
        - name: wordpress
          image: wordpress:7.0-php8.3-apache
          env:
            - { name: WORDPRESS_DB_HOST, value: "mariadb:3306" }
            - { name: WORDPRESS_DB_NAME, value: "wordpress" }
            - { name: WORDPRESS_DB_USER, value: "wordpress" }
            - name: WORDPRESS_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: mariadb, key: MARIADB_PASSWORD } }
            # TLS terminated by Envoy: we force HTTPS detection through X-Forwarded-Proto
            # and pin the site URL (otherwise redirect loops / http URLs).
            - name: WORDPRESS_CONFIG_EXTRA
              value: |
                define('WP_HOME', 'https://wordpress.lab.example.io');
                define('WP_SITEURL', 'https://wordpress.lab.example.io');
                if (isset($_SERVER['HTTP_X_FORWARDED_PROTO']) && $_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https') {
                  $_SERVER['HTTPS'] = 'on';
                }
          ports:
            - { name: http, containerPort: 80 }
          volumeMounts:
            - name: data
              mountPath: /var/www/html
              subPath: wp
          readinessProbe:
            httpGet: { path: /wp-login.php, port: 80 }
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { memory: 512Mi }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: wordpress-data }
---
apiVersion: v1
kind: Service
metadata:
  name: wordpress
  namespace: wordpress-test
spec:
  selector: { app: wordpress }
  ports:
    - { name: http, port: 80, targetPort: 80 }
---
# ---------- Exposition Gateway API ----------
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: wordpress
  namespace: wordpress-test
spec:
  parentRefs:
    - name: main-gateway
      namespace: envoy-gateway-system
      sectionName: https           # TLS :443 listener (cert-manager wildcard cert)
  hostnames:
    - wordpress.lab.example.io
  rules:
    - backendRefs:
        - name: wordpress
          port: 80
