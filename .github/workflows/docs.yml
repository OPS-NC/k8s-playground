# Publishes this repository's documentation to GitHub Pages.
#
# The page is built by docs/build.py (markdown-it-py + Pygments, dependencies declared through
# PEP 723 → installed by uv) from the repository's README.md (EN) and LISEZ-MOI.md (FR) files.
# A SINGLE self-contained HTML page, bilingual EN/FR (English by default) with a light/dark
# theme: no CDN, no external asset.
#
# The artefact is NOT versioned: it is regenerated on every push to main, which avoids a
# several-hundred-kilobyte diff on every documentation change.
#
# ---------------------------------------------------------------------------
# PUBLISHING: ENABLED.
#   Public repository, Pages source set to "GitHub Actions", repository variable
#   PUBLISH_PAGES=true. URL: https://ops-nc.github.io/k8s-playground/
#
# The `deploy` job stays gated on PUBLISH_PAGES. That is deliberate: Pages is refused on a
# private repository outside a paid plan, and without that guard the job would fail on every
# push if the repository went private again — turning the Actions tab into a wall of red
# crosses, until nobody looks at CI any more. To suspend publishing without touching the
# workflow:  gh variable set PUBLISH_PAGES --body false
#
# The `build` job, on the other hand, ALWAYS runs: it builds the documentation, requires every
# link and every anchor to resolve (--strict), and refuses to publish if it detects a secret
# pattern.
# ---------------------------------------------------------------------------
name: docs

on:
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - docs/build.py
      - .github/workflows/docs.yml
  workflow_dispatch: {}

# Minimal permissions: read the code, write Pages, and the OIDC token deploy-pages requires.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, without cancelling the one in flight (Pages does not like that).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # astral-sh/setup-uv no longer publishes a floating major tag beyond v7: we pin the
      # exact version (a `@v9` does not exist and makes the job fail).
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          # The dependencies are declared through PEP 723 INSIDE build.py: without this glob,
          # uv looks for a requirements.txt/pyproject.toml, finds none, and annotates the job
          # with "the cache will never get invalidated". So the cache follows the only file
          # that carries the versions.
          cache-dependency-glob: docs/build.py

      # build.py queries git (ls-files, check-ignore, log -1): the checkout is enough.
      #
      # `--strict`: a dead link or anchor FAILS the job. This repository's READMEs cite each
      # other a lot (every component points back to the base layer and to its neighbours):
      # without that guard, holed documentation would publish silently.
      # Locally: `make docs-check`.
      - name: Build the page (links and anchors verified)
        run: uv run docs/build.py --strict --out _site/index.html

      # Guard rail: no secret must end up in the published page. The repository is public and
      # the documentation quotes a lot of commands — a real value pasted into a README by
      # accident would be published as is.
      - name: Check for the absence of secrets
        run: |
          if grep -qE 'hvs\.[A-Za-z0-9]{15,}|cfat_[A-Za-z0-9]{15,}|-----BEGIN [A-Z ]*PRIVATE KEY' _site/index.html; then
            echo "::error::A secret pattern was detected in the generated page." && exit 1
          fi
          echo "✅ no secret pattern detected"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    # Without this guard the job fails on every push as long as Pages cannot be enabled
    # (a private repository on a Free plan). See the file header to enable it.
    if: vars.PUBLISH_PAGES == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
