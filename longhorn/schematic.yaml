# Talos Image Factory schematic: an installer including the extensions Longhorn requires.
# Talos no longer allows adding extensions at runtime: they are baked into the installer
# image, set through machine.install.image (see patch-longhorn.yaml).
#
#   - siderolabs/iscsi-tools     : iscsid + iscsiadm (mounting Longhorn volumes)
#   - siderolabs/util-linux-tools: fstrim (trimming the volumes)
#
# Generate the schematic ID then the installer reference (jq required):
#   SCHEMATIC_ID=$(curl -sX POST --data-binary @longhorn/schematic.yaml \
#     https://factory.talos.dev/schematics -H "Content-Type: application/yaml" | jq -r .id)
#   echo "factory.talos.dev/installer/${SCHEMATIC_ID}:v1.13.7"   # = TALOS_VERSION (lab.env)
customization:
  systemExtensions:
    officialExtensions:
      - siderolabs/iscsi-tools
      - siderolabs/util-linux-tools
