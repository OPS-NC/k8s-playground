# The "base" Longhorn StorageClass with 1 block replica — shared by the add-ons.
#
# The default `longhorn` StorageClass replicates every volume onto 3 nodes (3 block copies).
# `longhorn-r1` keeps only ONE. Use it when block replication is redundant:
#   - reconstructible / throwaway data      → observability (Prometheus, Loki, Grafana);
#   - replication already done at the application level → CloudNativePG (3 Postgres instances).
#
# Benefit: ~3x less disk consumed (crucial on the box's single disk, shared between the OS,
# the container images and Longhorn: stacking 3-replica volumes there triggers
# ReplicaSchedulingFailure).
# Trade-off: if the node hosting the copy dies, the volume is lost — acceptable for the cases
# above (the data is rebuilt: Prometheus re-scrapes, CNPG rebuilds the replica…).
#
# Defined ONCE here (the base layer); consumed by cloudnative-pg/ and observability/.
# Apply it after installing Longhorn: kubectl apply -f longhorn/longhorn-r1-storageclass.yaml
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-r1
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: Immediate
parameters:
  numberOfReplicas: "1"
  staleReplicaTimeout: "30"
  fsType: "ext4"
