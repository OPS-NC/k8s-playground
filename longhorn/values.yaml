# Longhorn Helm values tuned for the Talos / kubeadm labs.
defaultSettings:
  # Where the data lives, per distribution:
  #   kubeadm: /var/lib/longhorn is a plain directory of the VM's root filesystem (the
  #     Vagrantfile attaches NO extra disk) → Longhorn shares the box's disk with the OS and
  #     the container images;
  #   Talos  : /var/lib/longhorn lives on the EPHEMERAL partition (persistent across reboots,
  #     NOT across a reset/reinstall without --preserve), on a ~20 GB install disk that is
  #     also SHARED with the OS.
  # In both cases → keep an eye on `DiskPressure`. For real storage, attach a dedicated disk
  # and mount it (see the README, "Dedicated disk" section; /var/mnt/longhorn on Talos).
  defaultDataPath: /var/lib/longhorn
  # Number of replicas = number of available storage nodes. `longhorn-up.sh` overrides this
  # value with the number of workers ACTUALLY present in the cluster (capped at 3) —
  # lab.env.example ships WORKERS=2, so 2 in practice. By hand, LOWER it to 1 or 2 with fewer
  # than 3 workers, otherwise the volumes stay "Degraded" forever.
  defaultReplicaCount: 3
persistence:
  # The `longhorn` StorageClass set as the cluster default.
  defaultClass: true
  defaultClassReplicaCount: 3
