# Talos machine config patch for Longhorn — kubelet.extraMounts.
#
# `/var/lib/longhorn` shared as `rshared`: mandatory for the bidirectional mount propagation
# of the longhorn-manager (the Talos kubelet is containerised). To be applied wherever
# Longhorn volumes will be mounted — here, the WORKERS (the CPs are `NoSchedule`).
#
# The installer WITH the extensions (iscsi-tools + util-linux-tools, see schematic.yaml) is NO
# LONGER handled here: it is driven by `INSTALLER_IMAGE` in `lab.env`
# (cluster-up.sh --install-image). This patch therefore only does the mount.
#
# How to apply:
#   - fresh cluster : `--config-patch @longhorn/patch-longhorn.yaml` at gen config time;
#   - running cluster: `talosctl -n <worker-ip> patch mc --patch @longhorn/patch-longhorn.yaml`
#     (applied without a reboot).
machine:
  kubelet:
    extraMounts:
      - destination: /var/lib/longhorn
        type: bind
        source: /var/lib/longhorn
        options:
          - bind
          - rshared
          - rw
