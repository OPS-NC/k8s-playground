# Exposes the Longhorn UI through the Gateway API, over HTTPS, at `longhorn.lab.example.io`.
# NEUTRAL domain (public repository): this file is applied BY HAND, so edit the hostname or go
# through `sed 's/lab\.example\.io/<your-domain>/g' … | kubectl apply -f -`.
# Cert = the `*.lab.example.io` wildcard already carried by the `https` listener of
# main-gateway (cert-manager) — no new Certificate needed.
#
# ⚠️ The Longhorn UI has NO built-in authentication. Behind this Gateway it is reachable by
# anyone who can reach the VIP (through Tailscale). To protect it, add an Envoy Gateway
# SecurityPolicy (Basic Auth / OIDC) — see the README.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: longhorn-frontend
  namespace: longhorn-system
spec:
  parentRefs:
    - name: main-gateway
      namespace: envoy-gateway-system
      sectionName: https           # TLS :443 listener
  hostnames:
    - longhorn.lab.example.io     # matches the *.lab.example.io wildcard
  rules:
    - backendRefs:
        - name: longhorn-frontend
          port: 80
