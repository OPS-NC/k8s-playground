# 04 — VALIDATE (Audit): forbids privileged containers.
#
# Teaching point: it overlaps the PodSecurity `baseline` level — enforced cluster-wide on
# Talos, but NOT on kubeadm, which is exactly why the rule is interesting. It also shows how
# Kyverno expresses a security rule (and could go further than PSA: targeted exceptions,
# custom messages, a centralised report). `=(...)` = "if the field exists, it must equal this"
# — that avoids making securityContext mandatory just to test privileged.
#
# NOTE: `longhorn-system` is labelled `privileged` (it needs to be); this policy will report it
# in Audit — that is expected and precisely illustrates the point of a PolicyException (see the
# README, "exception" scenario).
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-privileged-containers
  annotations:
    policies.kyverno.io/title: Disallow privileged containers
    policies.kyverno.io/category: Security (Pod Security Baseline)
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Privileged containers disable isolation and give near-root access to the host.
      Forbidden. Audit mode.
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: privileged-containers
      match:
        any:
          - resources:
              kinds: [Pod]
      validate:
        message: "Privileged containers are forbidden."
        pattern:
          spec:
            =(ephemeralContainers):
              - =(securityContext):
                  =(privileged): "false"
            =(initContainers):
              - =(securityContext):
                  =(privileged): "false"
            containers:
              - =(securityContext):
                  =(privileged): "false"
