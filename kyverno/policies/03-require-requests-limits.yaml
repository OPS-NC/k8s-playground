# 03 — VALIDATE (Audit): requires requests AND limits (cpu + memory) on every container.
#
# Teaching point: directly tied to this lab's constraint (etcd/CPs with little RAM). Without
# requests/limits, a Pod can starve a node. Kyverno makes it possible to guarantee that EVERY
# container declares its resources. Audit mode here — see how many of the lab's workloads are
# already off the mark in the UI.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-requests-limits
  annotations:
    policies.kyverno.io/title: Require resource requests and limits
    policies.kyverno.io/category: Reliability
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Every container must declare requests and limits (cpu + memory) to avoid resource
      starvation on the nodes. Audit mode.
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: validate-resources
      match:
        any:
          - resources:
              kinds: [Pod]
      validate:
        message: "requests and limits (cpu + memory) are required on every container."
        pattern:
          spec:
            containers:
              - resources:
                  requests:
                    memory: "?*"
                    cpu: "?*"
                  limits:
                    memory: "?*"
                    cpu: "?*"
