# 20 — GENERATE: creates a "default-deny" NetworkPolicy in OPT-IN namespaces.
#
# Teaching point: Kyverno's third superpower. `generate` CREATES a derived resource when a
# trigger appears. The textbook case: every new namespace should start with a network
# default-deny. Here we ONLY target namespaces carrying the `kyverno-demo: "true"` label —
# otherwise a cluster-wide default-deny would cut the traffic of the lab's other demos
# (WordPress, Vault, Argo…). During training, labelling a test namespace is enough to watch the
# NetworkPolicy appear on its own.
#
#   kubectl create ns demo-netpol
#   kubectl label ns demo-netpol kyverno-demo=true
#   kubectl -n demo-netpol get netpol      # the default-deny generated by Kyverno
#
# `synchronize: true` => if the generated NetworkPolicy is edited or deleted, Kyverno puts it
# back.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: generate-default-netpol
  annotations:
    policies.kyverno.io/title: Generate default-deny NetworkPolicy (opt-in)
    policies.kyverno.io/category: Network security
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      Generates a default-deny NetworkPolicy in every namespace labelled
      `kyverno-demo=true`. A demonstration of resource generation.
spec:
  rules:
    - name: default-deny
      match:
        any:
          - resources:
              kinds: [Namespace]
              selector:
                matchLabels:
                  kyverno-demo: "true"
      generate:
        apiVersion: networking.k8s.io/v1
        kind: NetworkPolicy
        name: default-deny
        namespace: "{{request.object.metadata.name}}"
        synchronize: true
        data:
          spec:
            # An empty selector = applies to ALL pods of the namespace.
            podSelector: {}
            policyTypes:
              - Ingress
              - Egress
