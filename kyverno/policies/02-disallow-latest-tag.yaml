# 02 — VALIDATE (Audit): forbids the `:latest` image tag (or the absence of a tag).
#
# Teaching point: two rules in a single policy + the use of operators on images. `:latest`
# breaks reproducibility (you do not know which version is running) and rollbacks. Audit mode:
# we spot the culprits in the UI without breaking what exists.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-latest-tag
  annotations:
    policies.kyverno.io/title: Disallow latest tag
    policies.kyverno.io/category: Best practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      Images must be pinned to an explicit tag (no `:latest`, no missing tag). Audit mode.
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: require-image-tag
      match:
        any:
          - resources:
              kinds: [Pod]
      validate:
        message: "An image must have an explicit tag."
        pattern:
          spec:
            containers:
              - image: "*:*"          # must contain a ':' → a tag is present
    - name: validate-image-tag
      match:
        any:
          - resources:
              kinds: [Pod]
      validate:
        message: "The `:latest` image tag is forbidden."
        pattern:
          spec:
            containers:
              - image: "!*:latest"    # must NOT end with :latest
