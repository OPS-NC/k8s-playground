# 01 — VALIDATE (Audit): requires the standard `app.kubernetes.io/name` label on Pods.
#
# Teaching point: Kyverno's basic building block. `validate` + `pattern` = "the resource MUST
# look like this". `validationFailureAction: Audit` => we DO NOT prevent creation, we merely
# record a `fail` result in a PolicyReport (visible in the UI). Switch it to `Enforce` to
# actually block (do that knowingly: it will refuse every non-compliant Pod, including those
# of the lab's other demos).
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-labels
  annotations:
    policies.kyverno.io/title: Require app.kubernetes.io/name label
    policies.kyverno.io/category: Best practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      Every Pod must carry the `app.kubernetes.io/name` label (traceability, selectors,
      dashboards). Audit mode: reports without blocking.
spec:
  validationFailureAction: Audit
  background: true              # also applies the rule as a background scan on existing objects
  rules:
    - name: check-app-name-label
      match:
        any:
          - resources:
              kinds: [Pod]
      validate:
        message: "The `app.kubernetes.io/name` label is required."
        pattern:
          metadata:
            labels:
              app.kubernetes.io/name: "?*"    # ?* = at least one character
