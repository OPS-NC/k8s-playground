# 10 — MUTATE: automatically adds a traceability label to Pods at admission time.
#
# Teaching point: Kyverno's second superpower after validate. `mutate` REWRITES the incoming
# resource. Here we add `lab.k8s/managed-by: kyverno` when it is missing (`+(...)` = "add this
# key if it does not exist, never overwrite it"). Harmless: one more label breaks no workload.
# It only applies to NEW Pods (mutation happens at admission).
#
# Demo: create a Pod without that label, then `kubectl get pod <x> --show-labels` → it is there.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: add-managed-by-label
  annotations:
    policies.kyverno.io/title: Add managed-by label (mutate)
    policies.kyverno.io/category: Best practices
    policies.kyverno.io/severity: low
    policies.kyverno.io/description: >-
      Adds the `lab.k8s/managed-by: kyverno` label to Pods that do not have it.
      A demonstration of mutation at admission time.
spec:
  rules:
    - name: add-label
      match:
        any:
          - resources:
              kinds: [Pod]
      mutate:
        patchStrategicMerge:
          metadata:
            labels:
              +(lab.k8s/managed-by): kyverno
