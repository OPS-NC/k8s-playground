# values.yaml — Kyverno for the Talos / kubeadm labs (kyverno/kyverno chart).
#
# Kyverno is a Kubernetes "policy engine": it validates / mutates / generates resources at
# admission time (webhook) and in the background (background scan). It writes its verdicts
# into PolicyReports, which Policy Reporter aggregates into a UI (see
# policy-reporter-values.yaml).
#
# "Lab" choices:
#   - replicas=1 per controller (slimming down; in production you run 3 for the
#     admission-controller so the webhook is never lost). On 3 GB CPs (see lab.env) that
#     saves real memory.
#   - resources left at the chart defaults (req 128Mi / lim 384Mi, cpu 100m) — already frugal.
#   - the default securityContext is `restricted`-compliant: Kyverno runs unprivileged, so
#     nothing to label — Kyverno stays admissible under `baseline` (Talos' cluster default) as
#     well as under `restricted`. kubeadm, for its part, enforces no PodSecurity level
#     cluster-wide by default.
#
# Important security note: the chart already excludes `kube-system`, `kube-public` and
# `kube-node-lease` from its webhooks (config.resourceFilters). System components are
# therefore NEVER subject to the policies — no risk of blocking the apiserver or the CNI.

# Kyverno is purely INFORMATIVE in this lab: it must NEVER block an operation.
#   - forceFailurePolicyIgnore: forces ALL webhooks to `failurePolicy: Ignore` (fail-open). If
#     the admission-controller is down/slow, the operation goes through anyway — this avoids
#     the "Kyverno is broken => no pod can be created/deleted any more" deadlock.
#   - paired with `validationFailureAction: Audit` on the policies (verdicts are reports, not
#     rejections). For real, targeted blocking, switch a policy back to Enforce.
features:
  forceFailurePolicyIgnore:
    enabled: true

# Admission controller: applies the validate/mutate policies to incoming requests.
admissionController:
  replicas: 1

# Background controller: applies mutate/generate to existing objects + periodic re-scan.
backgroundController:
  replicas: 1

# Cleanup controller: runs the CleanupPolicies (TTL on resources). Lightweight.
cleanupController:
  replicas: 1

# Reports controller: produces the PolicyReports consumed by Policy Reporter.
reportsController:
  replicas: 1
