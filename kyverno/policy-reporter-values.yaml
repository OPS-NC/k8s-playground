# policy-reporter-values.yaml — Policy Reporter + UI to visualise the Kyverno verdicts.
#
# Kyverno writes its results into (Cluster)PolicyReports. Policy Reporter watches those
# reports and exposes:
#   - an API + Prometheus metrics,
#   - a web UI (dashboard: violations by policy / namespace / severity),
#   - a "kyverno plugin" that enriches the UI with the detail of the Kyverno policies.
#
# Exposure: the UI runs in plaintext (port 8080), HTTPS is handled by Envoy Gateway (the
# *.lab.example.io wildcard cert). See httproute.yaml → kyverno.lab.example.io.

# --- Policy Reporter core -----------------------------------------------------
# Default retention/scan: enough for a single-cluster lab.
worker: 3

# --- Web UI -------------------------------------------------------------------
ui:
  enabled: true
  replicaCount: 1
  # The UI needs to know its back ends (core + kyverno plugin); the chart wires that up
  # automatically when ui.enabled + plugin.kyverno.enabled are true.

# --- Plugins (source detail in the UI) ----------------------------------------
plugin:
  # Detail of the Kyverno policies (validate/mutate/generate).
  kyverno:
    enabled: true
    replicaCount: 1
  # Surfaces the Trivy Operator reports (CVEs, config audit, secrets, RBAC) in this same UI.
  # No effect until ../trivy-operator/ is installed, but harmless to leave enabled. See
  # trivy-operator/.
  trivy:
    enabled: true
    replicaCount: 1

# --- Metrics (optional: ready for a future Prometheus/kube-prometheus-stack) ---
metrics:
  enabled: true
