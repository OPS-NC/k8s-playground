# Exposes the Policy Reporter UI (the dashboard of Kyverno verdicts) over HTTPS at
# `kyverno.lab.example.io`, behind `main-gateway` (Envoy Gateway). TLS is the
# `*.lab.example.io` wildcard already carried by the `https` listener (cert-manager) — no
# Certificate to create, the wildcard covers `kyverno.lab.example.io`.
#
# The route lives in the `kyverno` namespace but attaches to the Gateway of the
# `envoy-gateway-system` namespace: possible because `main-gateway` opens its listeners to
# `from: All`. Backend in the same namespace as the route → no ReferenceGrant.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: policy-reporter-ui
  namespace: kyverno
spec:
  parentRefs:
    - name: main-gateway
      namespace: envoy-gateway-system
      sectionName: https          # targets the TLS :443 listener
  hostnames:
    - kyverno.lab.example.io     # matches the *.lab.example.io wildcard
  rules:
    - backendRefs:
        # Policy Reporter UI — plain HTTP (8080), Envoy does the HTTPS in front.
        - name: policy-reporter-ui
          port: 8080
