# values.yaml — chaoskube on the Talos / kubeadm labs.
# chaoskube chart 0.6.0 (app 0.39.0). Namespace: chaos-kube.
#
# Principle: chaoskube kills ONE random pod on every `interval`, across the whole cluster
# except what we exclude. It is a fault injector: it exists to check that the lab's
# Deployments/StatefulSets rebuild themselves.
#
# ⚠️ `no-dry-run` is what makes chaoskube REAL. Without that flag the chart runs in dry-run
# (the upstream default): it logs "would kill …" and never deletes anything. That is pitfall
# number one — a chaoskube you believe is active while it is only talking.

replicaCount: 1

chaoskube:
  args:
    # One pod killed per hour (the lab's requirement).
    interval: "1h"
    # Namespaces spared. Selector syntax: `!ns` = exclusion, comma-separated.
    #   - kube-system      : killing coredns / cilium / kube-apiserver breaks the cluster, not
    #                        an application — the lab has a single control plane.
    #   - longhorn-system  : the CSI carries the volumes of EVERYTHING else; killing an
    #                        instance-manager unmounts volumes that are still mounted.
    #   - vault            : the Raft survives losing a pod, but the pod comes back SEALED (no
    #                        auto-unseal here). Within a few hours all 3 are sealed and Vault
    #                        is down — that tests nothing any more, it just demands a manual
    #                        ../vault-cluster/vault-up.sh every time.
    #   - cnpg-demo        : the demo Postgres cluster (`Cluster/pg-demo`, see
    #                        ../cloudnative-pg/cluster-demo.yaml). The operator itself lives in
    #                        cnpg-system and stays fair game: killing it cuts no data path.
    namespaces: "!kube-system,!longhorn-system,!vault,!cnpg-demo"
    # Disables the dry-run: from here on, pods are REALLY deleted.
    no-dry-run: ""
    # Timezone used in the logs (and by excluded-weekdays / excluded-times-of-day if we ever
    # add one). Without it chaoskube reasons in UTC.
    timezone: "Pacific/Noumea"

# The lab is tight on RAM (18 GB for the default topology): chaoskube only does a sleep loop
# plus one API call per hour, it needs nothing.
resources:
  requests:
    cpu: 10m
    memory: 16Mi
  limits:
    memory: 64Mi

# The chart creates the ServiceAccount + the ClusterRole (list/delete pods cluster-wide):
# those permissions are broad by nature, that is the tool's job.
serviceAccount:
  create: true
