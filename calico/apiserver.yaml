# apiserver.yaml — the Tigera operator's `APIServer` CR: it triggers the deployment of the
# `calico-apiserver`, which exposes the `projectcalico.org/v3` group. That is what makes it
# possible to read and write Calico objects (`IPPool`, `NetworkPolicy`/`GlobalNetworkPolicy`,
# tiers…) straight from `kubectl`, without installing `calicoctl`.
#
# WHY THIS FILE EXISTS — the same bootstrap problem as installation.yaml, only worse:
#
# The `tigera-operator` chart renders this CR itself when `apiServer.enabled=true` (its
# default, see templates/crs/custom-resources.yaml). But the chart ships NO `crds/` directory:
# it is the operator that creates the `operator.tigera.io` CRDs at startup
# (`-manage-crds=true`). On a fresh cluster, Helm therefore tries to lay down an `APIServer`
# object while the `apiservers.operator.tigera.io` CRD does not exist yet, and the install
# fails outright, BEFORE the namespace is even created:
#
#   Error: unable to build kubernetes objects from release manifest: resource mapping not
#   found for name: "default" ... no matches for kind "APIServer" in version
#   "operator.tigera.io/v1" — ensure CRDs are installed first
#
# That is exactly why the script already turns off `installation`, `goldmane` and `whisker`:
# all four chart CRs are in the same situation. `apiServer` had been left at `true`, which made
# the install impossible on a freshly bootstrapped cluster.
#
# The CR is therefore taken out of the chart (`--set apiServer.enabled=false`) and applied by
# calico-up.sh AFTER waiting for the CRDs — the same mechanism and the same single owner
# (kubectl, not Helm) as installation.yaml.
---
apiVersion: operator.tigera.io/v1
kind: APIServer
metadata:
  name: default
spec: {}
