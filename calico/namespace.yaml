# Namespace of the Tigera operator.
#
# PodSecurity `privileged`: the operator runs on `hostNetwork` (which is what lets it start
# while NO CNI is installed yet — without a pod network an ordinary pod would have no IP) and
# mounts the `/var/lib/calico` hostPath.
#
# On Talos the cluster default is `baseline`, which refuses both: these labels are MANDATORY.
# On kubeadm, PodSecurity admission enforces nothing cluster-wide by default: they unlock
# nothing today, but they DOCUMENT what the operator needs and protect it the day admission is
# hardened (Kyverno, a default `AdmissionConfiguration`, a managed cluster). In those cases
# their absence produces a SILENT failure: the Deployment is created, but the ReplicaSet can
# create NO pod:
#
#   Error creating: pods "tigera-operator-..." is forbidden: violates PodSecurity
#   "baseline:latest": host namespaces (hostNetwork=true), hostPath volumes
#   (volume "var-lib-calico")
#
# Misleading symptom: `kubectl -n tigera-operator get pods` returns NOTHING (not a failing
# pod, zero pods) and the script fails on the `rollout status` timeout. The cause is in the
# ReplicaSet events: `kubectl -n tigera-operator describe rs`.
#
# `helm --create-namespace` sets no PSS label at all: so we create the namespace ourselves,
# BEFORE the chart. Same recipe as ../observability/namespace.yaml.
#
# Note: the `calico-system` namespace (calico-node, typha) is created by the operator itself,
# which puts the `privileged` PSS labels on it — nothing to do on that side.
apiVersion: v1
kind: Namespace
metadata:
  name: tigera-operator
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
