# installation.yaml — the Tigera operator's `Installation` CR: THIS is what describes the
# Calico CNI to deploy (the operator on its own does nothing until it exists).
#
# Applied by `calico/calico-up.sh` AFTER the `tigera-operator` chart, because it is the
# operator (`-manage-crds=true`) that creates the `operator.tigera.io` CRDs at startup:
# applying this file too early fails with "no matches for kind Installation".
#
# The chart can generate this CR itself (`installation.enabled=true`, its default). We take it
# out of the chart (`--set installation.enabled=false` in the script) for a single reason: to
# have ONE readable, versioned file instead of a pile of nested `--set` — and to stop Helm and
# `kubectl apply` from fighting over the ownership of the same object.
#
# Both CIDRs below are substituted on the fly by calico-up.sh (`POD_CIDR`, read first from
# `_out/cluster.env`, and `NETWORK` from lab.env): the values written here are the lab
# defaults.
---
apiVersion: operator.tigera.io/v1
kind: Installation
metadata:
  name: default
spec:
  # Open-source Calico (not the Tigera Enterprise variant).
  variant: Calico

  # Replicas of Calico's "control plane" components (Typha, calico-apiserver).
  # 2 is plenty for an 8-node lab; it is also the operator's default.
  controlPlaneReplicas: 2

  # ------------------------------------------------------------------------------------
  # Calico's CSI driver disabled.
  #   - Talos  : REQUIRED. The official Sidero guide ("Deploy Calico CNI") mandates `None`.
  #   - kubeadm: purely slimming down. On Debian the CSI would work fine, but it only serves
  #     the ephemeral volumes of flow logs, unused here: `None` removes one DaemonSet per node
  #     and loses nothing.
  # Without this field the operator additionally deploys the `csi-node-driver` DaemonSet and
  # mounts `/var/lib/kubelet`.
  kubeletVolumePluginPath: None

  # FlexVolume disabled.
  # Without this field the operator falls back to its generic default
  # `/usr/libexec/kubernetes/kubelet-plugins/volume/exec/` and adds to `calico-node` a
  # `flexvol-driver` init container whose hostPath is mounted as `DirectoryOrCreate`
  # (see tigera/operator, pkg/render/node.go).
  #   - Talos  : BLOCKING without `None`. `/usr` is READ-ONLY: the kubelet cannot create the
  #     directory and the pod stays stuck before starting.
  #   - kubeadm: slimming down. FlexVolume has been deprecated since Kubernetes 1.23 and is
  #     only used here for Dikastes' UDS socket (L7 application policy), unused.
  # `None` simply removes the init container and its volume.
  flexVolumePath: None

  calicoNetwork:
    # --------------------------------------------------------------------------------
    # BGP DISABLED. That is a deliberate choice, not an oversight: the lab runs on a
    # VirtualBox host-only network, there is no router to peer with. Without a BGP peer BIRD
    # is useless — and that is precisely why Calico can NOT announce `LoadBalancer` Service
    # IPs here (Calico's service-IP advertisement only exists over BGP, it has no equivalent
    # of Cilium's L2/ARP announcement). See README.md.
    bgp: Disabled

    # The iptables dataplane (the operator's default), made explicit so that it reads as a
    # reviewed choice and not as an accident:
    #  - we KEEP the cluster's kube-proxy (iptables mode): the one laid down by
    #    `kubeadm init`, or the one Talos installs at bootstrap. On kubeadm, that is why
    #    `CNI=calico` REQUIRES `KUBE_PROXY_REPLACEMENT=false`: nothing here replaces
    #    kube-proxy, and cluster-up.sh already refuses the opposite pair;
    #  - Calico's BPF dataplane would additionally require `bpfNetworkBootstrap`,
    #    `kubeProxyManagement: Enabled` and a `FelixConfiguration` (`cgroupV2Path`), and it is
    #    broken on some Talos versions (siderolabs/talos#12221: "BPF program load failed" on
    #    calico_sendmsg_v46). Too many moving parts for the lab's "comparison" CNI: if we want
    #    eBPF here, we take Cilium.
    linuxDataplane: Iptables

    # Corollary of the previous point: the operator does NOT touch the kube-proxy DaemonSet
    # (that is already its default, spelled out here to avoid any surprise).
    kubeProxyManagement: Disabled

    # Pod network MTU: 1500 (host-only) - 50 (IPv4 VXLAN headers) = 1450.
    # Calico auto-detects it; we pin it so the value is readable in the repository.
    mtu: 1450

    # --------------------------------------------------------------------------------
    # PINNING THE HOST-ONLY INTERFACE — THE recurring trap of this lab (see CLAUDE.md).
    #
    # Every VM has TWO cards: the NAT one (`eth0`/`enp0s3`, 10.0.2.15, **the same address on
    # every VM**, carrying the default route) and the host-only one (`enp0s8`/`eth1`,
    # 192.168.56.x, the only genuinely unique identity). Calico's default autodetection
    # (`firstFound`) follows the default route: every node would register itself as
    # 10.0.2.15, every VXLAN tunnel would point at an isolated NAT => cross-node pod traffic
    # and DNS (CoreDNS on another node) broken. Same cause as flannel's `--iface-can-reach`
    # and Cilium's `devices=<host-only>`.
    #
    # `cidrs` forces Calico to keep the node address that falls inside the host-only network,
    # without depending on the card's name. A possible equivalent: `kubernetes:
    # NodeInternalIP` (kubeadm/templates/kubeadm-init.yaml.tpl already sets `node-ip` to the
    # host-only IP) — `cidrs` is more explicit. A node with no address in that range makes
    # calico-node fail: that is intended.
    nodeAddressAutodetectionV4:
      cidrs:
        - "192.168.56.0/24"

    ipPools:
      - name: default-ipv4-ippool
        # ⚠️ MUST be identical to the `networking.podSubnet` passed to `kubeadm init` (the lab
        # default: 10.244.0.0/16, see _out/cluster.env).
        # If the two diverge, the kubelet allocates pod IPs in a CIDR Calico never programmed:
        # the routes and the VXLAN tunnels correspond to nothing.
        # calico-up.sh refuses to carry on when they disagree.
        cidr: "10.244.0.0/16"

        # **Unconditional** VXLAN. Every node is on the same /24, so `VXLANCrossSubnet` would
        # fall back to unencapsulated direct routing between them: that assumes the host-only
        # virtual switch relays packets whose source IP is a pod IP — not verified here.
        # `VXLAN` always encapsulates, depends on no route on the VirtualBox side, and it is
        # the same choice already made for flannel (VXLAN) and Cilium (`routingMode=tunnel`).
        encapsulation: VXLAN

        # SNAT towards the outside of the cluster: pods leave with the node's IP (the default
        # route goes through the 10.0.2.2 NAT — intended).
        natOutgoing: Enabled

        # /26 = 64 IPs per block and per node; 10.244.0.0/16 offers plenty.
        blockSize: 26

        # This pool applies to every node (control planes included).
        nodeSelector: all()
