# Exposes Grafana, Prometheus and Alertmanager over HTTPS through `main-gateway` (Envoy
# Gateway). TLS = the `*.lab.example.io` wildcard (cert-manager) already carried by the
# `https` listener — no Certificate to create. Routes in the `monitoring` ns, backends in the
# same ns.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  parentRefs:
    - name: main-gateway
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - grafana.lab.example.io
  rules:
    - backendRefs:
        - name: kube-prometheus-stack-grafana
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prometheus
  namespace: monitoring
spec:
  parentRefs:
    - name: main-gateway
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - prometheus.lab.example.io
  rules:
    - backendRefs:
        - name: kube-prometheus-stack-prometheus
          port: 9090
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  parentRefs:
    - name: main-gateway
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - alertmanager.lab.example.io
  rules:
    - backendRefs:
        - name: kube-prometheus-stack-alertmanager
          port: 9093
