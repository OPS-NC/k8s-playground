# loki-values.yaml — Loki in "single binary" mode for the Talos / kubeadm labs
# (grafana/loki chart).
#
# The grafana/loki chart targets a "SimpleScalable" deployment by default (separate
# read/write/backend + S3-style object storage + multi-gigabyte memcached caches). WAY too
# much for a lab. Here we switch to **SingleBinary** + **filesystem** storage on a Longhorn
# PVC, and we TURN OFF the memcached caches (chunksCache=8Gi, resultsCache=1Gi by default!).

deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  # Required index schema (TSDB v13) — otherwise the chart refuses to start.
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  storage:
    type: filesystem
  limits_config:
    # How long the logs are kept. CAREFUL: this key only expresses the limit — it is the
    # COMPACTOR that actually deletes (the block below). Without it, `retention_period` is
    # purely declarative and the PVC fills up until saturation.
    retention_period: 24h
  # Compactor: compacts the indexes AND applies the retention. `retention_enabled` defaults to
  # false in Loki; without it, nothing is ever purged. `delete_request_store` is required as
  # soon as retention is active (it stores the deletion requests) — here the same filesystem
  # as the chunks.
  compactor:
    working_directory: /var/loki/compactor
    retention_enabled: true
    delete_request_store: filesystem
    # Grace period between marking a chunk and actually deleting it.
    retention_delete_delay: 2h
  # Loki runs as non-root: compatible with PodSecurity `baseline` (Talos' cluster default) and
  # with `restricted` should admission ever be hardened on kubeadm (which enforces none by
  # default).

# The only active component: the single binary, persistent on Longhorn (1 block replica).
singleBinary:
  replicas: 1
  persistence:
    enabled: true
    storageClass: longhorn-r1
    size: 3Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

# We neutralise every component of the scalable mode.
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

# memcached caches: TURNED OFF (otherwise ~9Gi of RAM requested by them alone).
chunksCache:
  enabled: false
resultsCache:
  enabled: false

# The nginx gateway is the single entry point (push + query) → loki-gateway:80.
gateway:
  enabled: true
  replicas: 1

# Extras the lab does not need.
lokiCanary:
  enabled: false
test:
  enabled: false
minio:
  enabled: false
