# Namespace of the observability stack.
#
# PodSecurity `privileged`: required by node-exporter (hostNetwork/hostPID/hostPath/hostPort)
# AND by Alloy (hostPath /var/log/pods to read the logs).
# On Talos the cluster default is `baseline`: these labels are MANDATORY, without them the
# pods are refused. On kubeadm no PodSecurity level is enforced by default: they change
# nothing today, but they document the intent and keep the namespace working if admission is
# hardened later (--admission-control-config-file on the apiserver).
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
