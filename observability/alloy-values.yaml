# alloy-values.yaml — Grafana Alloy: collects the pods' logs and pushes them to Loki.
#
# Alloy replaces Promtail (deprecated). **DaemonSet reading the /var/log/pods files** mode
# (like Promtail), NOT streaming through the Kubernetes API.
#
# WHY the file mode: reading the logs through `loki.source.kubernetes` (the API) sends ALL pod
# logs through the kube-apiserver — an enormous load which, on this lab, contributed to
# saturating the control planes. By reading /var/log/pods directly on each node (a DaemonSet,
# one share per node), the apiserver is NOT involved in the logs: `discovery.kubernetes` only
# does a light metadata watch to label the lines.

controller:
  type: daemonset
  # Tolerates everything → one Alloy on EVERY node, control planes included (apiserver/etcd
  # logs).
  tolerations:
    - operator: Exists

alloy:
  # Reads /var/log/pods (files owned by root) → runs as root in this privileged ns.
  securityContext:
    runAsUser: 0
    runAsGroup: 0
    runAsNonRoot: false
  # Mounts /var/log (hostPath) inside the container → access to the pods' log files.
  mounts:
    varlog: true
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
  configMap:
    content: |-
      // 1. Discover the pods (metadata only — a light watch, no logs through the API).
      discovery.kubernetes "pods" {
        role = "pod"
      }

      // 2. Label + build the path of each container's log file.
      discovery.relabel "pod_logs" {
        targets = discovery.kubernetes.pods.targets
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          target_label  = "app"
        }
        // File path: /var/log/pods/<ns>_<pod>_<ID>/<container>/*.log
        // We glob <ID> with `*` because it DIFFERS depending on the kind of pod:
        //   - ordinary pod       => <ID> = the API UID (__meta_kubernetes_pod_uid)
        //   - static/mirror pod (kube-apiserver, etcd, scheduler, controller-manager: laid
        //     down by kubeadm in /etc/kubernetes/manifests, managed by Talos otherwise)
        //     => <ID> = the static pod's config HASH, NOT the API UID. Building the path from
        //     the UID would therefore miss every control-plane log. So we match on
        //     <ns>_<pod>_* (a stable name) to cover both cases.
        rule {
          source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_name", "__meta_kubernetes_pod_container_name"]
          separator     = "/"
          regex         = "([^/]+)/([^/]+)/([^/]+)"
          action        = "replace"
          replacement   = "/var/log/pods/$1_$2_*/$3/*.log"
          target_label  = "__path__"
        }
      }

      // 3. Only tail the files present on this node (the other globs match nothing).
      local.file_match "pod_logs" {
        path_targets = discovery.relabel.pod_logs.output
      }

      // 4. Read the files, then parse containerd's CRI format.
      loki.source.file "pod_logs" {
        targets    = local.file_match.pod_logs.targets
        forward_to = [loki.process.pod_logs.receiver]
      }
      loki.process "pod_logs" {
        stage.cri {}
        forward_to = [loki.write.default.receiver]
      }

      // 5. Push to Loki (the gateway of the same namespace).
      loki.write "default" {
        endpoint {
          url = "http://loki-gateway.monitoring.svc.cluster.local/loki/api/v1/push"
        }
      }
