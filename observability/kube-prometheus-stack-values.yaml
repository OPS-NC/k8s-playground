# kube-prometheus-stack-values.yaml — the metrics stack of the Talos / kubeadm labs.
#
# Provides: Prometheus (+ the operator & the ServiceMonitor/PodMonitor CRDs), Grafana,
# Alertmanager, node-exporter, kube-state-metrics. It is the base of any "ops" module
# (PromQL, dashboards, alerting).
#
# Choix « lab » :
#   - storage on `longhorn-r1` (1 block replica, the StorageClass laid down by the longhorn/
#     add-on) → light PVCs, no saturation of the disk shared with the OS.
#   - short retention (2 days) + bounded resources (modest CPs/workers).
#   - controller-manager and scheduler SCRAPED (see below): unlike the Talos lab,
#     kubeadm/templates/kubeadm-init.yaml.tpl leur pose `bind-address: 0.0.0.0`.

grafana:
  # The chart's default admin password: admin / prom-operator (change it, see the README).
  persistence:
    enabled: true
    storageClassName: longhorn-r1
    size: 1Gi
  grafana.ini:
    server:
      # Grafana is exposed at the root of a dedicated host (no sub-path).
      domain: grafana.lab.example.io
      root_url: https://grafana.lab.example.io
  # Adds Loki as a log source (the Loki add-on runs in the same namespace).
  additionalDataSources:
    - name: Loki
      type: loki
      access: proxy
      url: http://loki-gateway.monitoring.svc.cluster.local
      jsonData:
        maxLines: 1000

prometheus:
  prometheusSpec:
    retention: 2d
    externalUrl: https://prometheus.lab.example.io
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn-r1
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 3Gi
    # Scrape EVERY ServiceMonitor/PodMonitor of the cluster (not only those carrying THIS
    # release's label). Essential to pick up trivy-operator, CloudNativePG, etc.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false

alertmanager:
  alertmanagerSpec:
    externalUrl: https://alertmanager.lab.example.io
    # No PVC: emptyDir storage (the default) — the alert history does not need to survive in a lab.

# --- Control-plane components ----------------------------------------------------------
# ⚠️ SECTION PILOTÉE PAR LE PROFIL DE DISTRIBUTION.
# `observability-up.sh` force `kubeControllerManager.enabled=false`,
# `kubeScheduler.enabled=false` et `kubeEtcd.enabled=false` quand
# `KPS_SCRAPE_CONTROL_PLANE=false` — that is to say on TALOS, where those components are not
# scrapable without dedicated TLS configuration: the targets would stay "down" with no
# explanation, the worst possible scenario during training.
# What is written below is therefore the KUBEADM case, where the lab's bootstrap made all
# three scrapable. We enable them case by case rather than in bulk, so as never to ship a
# cible morte.
#
# controller-manager and scheduler run as STATIC pods on the control planes. The chart creates
# a headless Service for them in `kube-system` whose selector is
# `component: kube-controller-manager` / `component: kube-scheduler` — exactly the labels
# kubeadm puts on its static manifests: nothing else to do.
kubeControllerManager:
  enabled: true
  service:
    enabled: true
    port: 10257
    targetPort: 10257
  serviceMonitor:
    https: true
    # The certificate served on :10257 is signed by the cluster CA but does NOT carry the
    # Service's DNS name: verification would fail (`x509: certificate is valid for ...`).
    # Acceptable here, the scrape stays encrypted and stays on the host-only network.
    insecureSkipVerify: true

kubeScheduler:
  enabled: true
  service:
    enabled: true
    port: 10259
    targetPort: 10259
  serviceMonitor:
    https: true
    insecureSkipVerify: true

# etcd: ENABLED, but only because the lab made it possible AT BOOTSTRAP.
#
# By default, kubeadm generates the etcd static pod with
# `--listen-metrics-urls=http://127.0.0.1:2381` : l'endpoint n'existe qu'en LOOPBACK,
# where it only serves the pod's liveness probe. Prometheus scrapes from a pod and cannot
# reach the node's loopback — the target would stay DOWN with no explanation.
#
# `kubeadm/templates/kubeadm-init.yaml.tpl` therefore passes `etcd.local.extraArgs`
# `listen-metrics-urls: http://0.0.0.0:2381`. If you build a cluster in any other way than
# through `kubeadm/cluster-up.sh`, set `enabled: false` again — otherwise you get a dead
# target.
#
# Port 2381 and `scheme: http`: this is the PLAINTEXT metrics endpoint, not to be confused
# with 2379 (etcd's client API, over mutual TLS, which would require mounting the etcd
# certificates into Prometheus).
# ⚠️ 2381 requires NO authentication at all: leaving it open is only acceptable because the
#    lab lives on an isolated host-only network.
kubeEtcd:
  enabled: true
  service:
    enabled: true
    port: 2381
    targetPort: 2381
  serviceMonitor:
    scheme: http

# kube-proxy: DISABLED because it DOES NOT EXIST. `KUBE_PROXY_REPLACEMENT=true` (the lab.env
# default) runs `kubeadm init --skip-phases=addon/kube-proxy` and Cilium handles Services in
# eBPF. The equivalent metrics come from Cilium (see cilium/).
# Even with `KUBE_PROXY_REPLACEMENT=false`, kube-proxy only exposes its metrics on
# 127.0.0.1:10249 until `metricsBindAddress` is opened.
kubeProxy:
  enabled: false
