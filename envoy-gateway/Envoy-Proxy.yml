# envoyproxy-l2.yaml
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: cilium-l2
  namespace: envoy-gateway-system
spec:
  provider:
    type: Kubernetes
    kubernetes:
      # The DATA plane (the envoy pods that actually carry the traffic), not to be confused
      # with the `envoy-gateway` controller laid down by the chart.
      #
      # 2 replicas and not 1: this Deployment is the single point of passage of ALL the lab's
      # UIs (one single LoadBalancer IP, .200). With 1 replica, losing that pod — a reschedule,
      # a node reboot, or chaos-kube/ drawing lots every hour — cuts every UI for the duration
      # of the restart. With 2, the Service keeps a ready endpoint.
      #
      # The cost is negligible (an idle envoy is ~50 MiB), and both pods share the same IP:
      # nothing to change on the DNS side or on the HTTPRoute side.
      envoyDeployment:
        replicas: 2
      envoyService:
        type: LoadBalancer
        loadBalancerClass: io.cilium/l2-announcer
        externalTrafficPolicy: Cluster
---
# gatewayclass.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: cilium-l2
    namespace: envoy-gateway-system
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: main-gateway
  namespace: envoy-gateway-system      # Gateway + wildcard cert outside the default ns
  annotations:
    # ⚠️ This whole `annotations:` block only exists on the ACME path. The lab default is
    # SELF_SIGNED=true: platform-up.sh then REMOVES these lines and fills the Secret below
    # itself, with a wildcard signed by openssl (see self-signed/). Leaving the annotation in
    # place would hand this Secret back to cert-manager the moment it got installed.
    #
    # With SELF_SIGNED=false, cert-manager issues and renews the wildcard on its own
    # (Cloudflare DNS-01): the Certificate + the wildcard-lab-example-io-tls Secret are
    # created in THIS namespace.
    #
    # STAGING default on purpose: Let's Encrypt production caps at 5 certificates per week per
    # set of identifiers, and the wildcard only lives in etcd — so every `vagrant destroy`
    # burns one. On the 6th rebuild in a single week, no TLS for hours. platform-up.sh
    # replaces this value with `letsencrypt-prod` when LAB_ACME_ISSUER=prod (see
    # lab.env.example).
    cert-manager.io/cluster-issuer: letsencrypt-staging
spec:
  gatewayClassName: envoy
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      protocol: HTTPS
      port: 443
      # NEUTRAL domain (public repository): platform-up.sh replaces it with LAB_DOMAIN
      # (lab.env), and the TLS Secret name below follows (wildcard-<dashed-domain>-tls).
      hostname: "*.lab.example.io"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            # Filled by cert-manager (SELF_SIGNED=false) OR by selfsigned-up.sh
            # (SELF_SIGNED=true, the default): the same Secret name in both cases.
            name: wildcard-lab-example-io-tls
      allowedRoutes:
        namespaces:
          from: All
