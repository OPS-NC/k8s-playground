# pg-app-backup-cnpg.yaml — the NATIVE CloudNativePG backup (through CRDs) of the `pg-demo`
# cluster (which holds the `app` database), pushed to MinIO over S3.
#
# ≠ the pg_dump-through-Vault backup (pg-backup-vault-s3.yaml): this one is PHYSICAL and
# managed by the operator (base backup + continuous WAL archiving → PITR), covering the WHOLE
# instance (so `app` included), with CNPG's INTERNAL credentials (not Vault's).
#
# Prerequisites: `spec.backup.barmanObjectStore` configured on the `pg-demo` Cluster (done by
# pg-app-backup-cnpg-up.sh; the snippet below is documentation only) + the `cnpg-backups` MinIO
# bucket + the `cnpg-backup-s3` Secret (access/secret key). CNPG operator <= 1.30 (in-tree
# barman).
#
# --- Snippet applied to the Cluster (for reference) -------------------------
#   spec:
#     backup:
#       retentionPolicy: "7d"
#       barmanObjectStore:
#         destinationPath: s3://cnpg-backups/
#         endpointURL: http://minio.minio-cluster.svc.cluster.local:9000
#         s3Credentials:
#           accessKeyId:     { name: cnpg-backup-s3, key: ACCESS_KEY_ID }
#           secretAccessKey: { name: cnpg-backup-s3, key: SECRET_ACCESS_KEY }
#         wal:  { compression: gzip }
#         data: { compression: gzip }
# ----------------------------------------------------------------------------
---
# RECURRING backup: every hour (CNPG's 6-field cron, the 1st being the seconds).
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: pg-demo-hourly
  namespace: cnpg-demo
spec:
  schedule: "0 0 * * * *"        # sec=0 min=0 => on the hour, every hour
  backupOwnerReference: self
  cluster:
    name: pg-demo
---
# ON-DEMAND backup (example): `kubectl apply` of this object triggers an immediate backup.
apiVersion: postgresql.cnpg.io/v1
kind: Backup
metadata:
  name: pg-demo-backup-now
  namespace: cnpg-demo
spec:
  cluster:
    name: pg-demo
