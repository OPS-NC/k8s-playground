# pg-backup-vault-s3.yaml — the HOURLY logical backup of the `vault` database, pushed to MinIO (S3).
#
# What makes it special: the PostgreSQL connection uses the credentials MANAGED BY VAULT (the
# `pg-rotate-creds` secret, whose password is rotated by the `vault-rotate` static role — see
# ../vault-secret-operator/). The dump is encrypted in transit (sslmode=require) then sent to
# the `pg-backups` bucket with a DEDICATED MinIO user (scoped to the bucket).
#
# Namespace: pg-rotate-demo (where VSO writes `pg-rotate-creds`). The `minio-backup-creds`
# MinIO Secret (endpoint + access/secret key) is created by pg-backup-up.sh.
#
# Prerequisites: CloudNativePG `pg-demo` UP + Vault rotation in place + the minio-s3/cluster add-on.
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pg-backup-vault-s3
  namespace: pg-rotate-demo
  labels: { app: pg-backup-vault-s3 }
spec:
  schedule: "0 * * * *"          # every hour, on minute 0
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels: { app: pg-backup-vault-s3 }
        spec:
          restartPolicy: Never
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
          containers:
            - name: backup
              # pg_dump 18 (aligned with PG server 18); mc fetched as a static binary at run time.
              image: postgres:18-alpine
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -euo pipefail
                  export HOME=/tmp        # uid 1000 with no passwd entry: mc config writes -> /tmp
                  # 1) MinIO client (mc) — a static binary, no package to install
                  wget -qO /tmp/mc https://dl.min.io/client/mc/release/linux-amd64/mc
                  chmod +x /tmp/mc
                  # 2) dump the `vault` database with the Vault credentials (DATABASE_URL from the secret)
                  ts="$(date -u +%Y%m%dT%H%M%SZ)"
                  file="/tmp/vault-${ts}.sql.gz"
                  echo "[backup] pg_dump base=${PGDATABASE} user=${PGUSER} (creds Vault) -> ${file}"
                  pg_dump "$DATABASE_URL" | gzip -9 > "$file"
                  echo "[backup] taille : $(ls -lh "$file" | awk '{print $5}')"
                  # 3) upload to the MinIO bucket with the dedicated user
                  /tmp/mc alias set s3 "$MINIO_ENDPOINT" "$MINIO_ACCESS_KEY" "$MINIO_SECRET_KEY" >/dev/null
                  /tmp/mc cp "$file" "s3/pg-backups/"
                  echo "[backup] contenu du bucket :"
                  /tmp/mc ls s3/pg-backups/
              envFrom:
                - secretRef: { name: pg-rotate-creds }     # DATABASE_URL + PGDATABASE/PGUSER/...
                - secretRef: { name: minio-backup-creds }  # MINIO_ENDPOINT/ACCESS/SECRET
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { memory: 256Mi }
