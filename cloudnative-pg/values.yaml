# values.yaml — the CloudNativePG operator for the Talos / kubeadm labs
# (cnpg/cloudnative-pg chart).
#
# This operator manages the LIFECYCLE of declarative PostgreSQL clusters (the `Cluster` CRD):
# provisioning, streaming replication, automatic failover, backups, rolling updates. It is the
# "operator" pattern at its purest — ideal for a training module.
#
# Here we only install the OPERATOR (lightweight, 1 pod). The demo PG cluster (3 nodes on
# Longhorn) is a separate `Cluster` object: see cluster-demo.yaml.
#
# "Lab" choices: the operator as 1 replica, the chart's default resources (already frugal).
# The operator's PodMonitor is disabled until kube-prometheus-stack is there.

replicaCount: 1

monitoring:
  # The PodMonitor CRD only exists after kube-prometheus-stack → leave it false for now.
  podMonitorEnabled: false
