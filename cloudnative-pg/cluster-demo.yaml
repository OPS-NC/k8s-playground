# cluster-demo.yaml — a demo HA PostgreSQL cluster, managed by CloudNativePG.
#
# 3 instances (1 primary + 2 streaming replicas), one per worker thanks to the default
# anti-affinity. Storage: a 1Gi RWO PVC on Longhorn (replicated at the block level BY Longhorn,
# on top of PostgreSQL's logical replication — two distinct layers).
#
# On creation the operator automatically generates:
#   - an `app` database + an `app` user,
#   - the `pg-demo-app` Secret (application credentials: host, user, password, dbname, uri),
#   - a `pg-demo-rw` Service (read/write → the primary) and `pg-demo-ro` (read → the replicas).
---
apiVersion: v1
kind: Namespace
metadata:
  name: cnpg-demo
# PostgreSQL ALREADY replicates its data through the 3 CNPG instances (streaming replication):
# so we store each instance on the base `longhorn-r1` StorageClass (1 block replica, defined in
# longhorn/longhorn-r1-storageclass.yaml). Stacking 3 Longhorn replicas PER instance would make
# 9 copies of the same dataset for 3 logical nodes — a waste, and it saturates the ~20 GB OS
# disk. If a node dies, CNPG rebuilds the lost instance from the primary.
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg-demo
  namespace: cnpg-demo
spec:
  # 3 nodes = 1 primary + 2 replicas kept in sync by streaming replication.
  instances: 3

  # Storage per instance: 1Gi RWO on the base longhorn-r1 SC (1 block replica).
  storage:
    size: 1Gi
    storageClass: longhorn-r1

  # Resources per instance — sized for 4 GB workers (see WK_MEM in lab.env).
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi

  # PostgreSQL settings suited to a small lab cluster.
  postgresql:
    parameters:
      max_connections: "100"
      shared_buffers: "128MB"

  # PodMonitor disabled until kube-prometheus-stack is installed (see the README).
  monitoring:
    enablePodMonitor: false

  # (default bootstrap: creates the `app` database + the `app` user + the pg-demo-app Secret)
