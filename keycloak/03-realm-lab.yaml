# 03-realm-lab.yaml — the `lab` realm, declared (the `KeycloakRealmImport` CRD).
#
# A fresh realm takes three clicks in the admin console; declaring it serves another purpose:
# the realm becomes REPRODUCIBLE. Destroy the lab, bring it back up, and the realm returns
# identical — same groups, same `groups` scope, same demo user. That is what lets downstream
# components (see `../dex/`) assume that `lab` exists and that it emits a `groups` claim.
#
# HOW IT WORKS: the operator creates a Job that starts an ephemeral Keycloak with
# `--import-realm` on this representation. The Job runs only once, and the import does NOT
# OVERWRITE an existing realm: re-applying this file therefore undoes nothing you did by hand.
# Corollary: editing this file does NOT modify an already-imported realm — you have to delete
# it (`kubectl -n keycloak delete keycloakrealmimport lab`, then the realm in the console) or
# make the change by hand.
#
# ⚠️ NO PASSWORD HERE. The repository is public. The demo user's password arrives through
#    `placeholders`: the operator exposes the Secret key as an environment variable of the
#    import Job, and Keycloak substitutes `${DEMO_PASSWORD}` at import time. The Secret is
#    generated by `keycloak-up.sh` (openssl), once, and is never printed.
apiVersion: k8s.keycloak.org/v2beta1
kind: KeycloakRealmImport
metadata:
  name: lab
  namespace: keycloak
spec:
  keycloakCRName: keycloak
  placeholders:
    DEMO_PASSWORD:
      secret:
        name: keycloak-demo-user
        key: password
  realm:
    realm: lab
    enabled: true
    displayName: Lab (k8s-playground)
    # No self-registration: on a lab realm reachable behind the VIP, an open sign-up form is a
    # way in, not a feature.
    registrationAllowed: false
    resetPasswordAllowed: true
    loginWithEmailAllowed: true
    # Lockout after repeated failures: the realm is reachable by every authorized Tailscale
    # peer, and a `demo` account with a weak password gets brute-forced.
    bruteForceProtected: true

    # --- Groups: the source of downstream authorisation ----------------------
    # They mean NOTHING inside Keycloak alone — it is the token's consumer that gives them a
    # meaning. In this repository they are the subjects of the ClusterRoleBindings laid down by
    # `../dex/`: `k8s-admins` -> cluster-admin, `k8s-viewers` -> view.
    groups:
      - name: k8s-admins
      - name: k8s-viewers

    # --- The `groups` scope ---------------------------------------------------
    # Keycloak DOES NOT EMIT group membership by default: without this scope the token carries
    # no `groups` claim and any RBAC based on it is silent — with no error, just an
    # unexplainable "forbidden" on the apiserver side.
    clientScopes:
      - name: groups
        protocol: openid-connect
        description: Group membership, flat, in the `groups` claim
        attributes:
          include.in.token.scope: "true"
          display.on.consent.screen: "false"
        protocolMappers:
          - name: groups
            protocol: openid-connect
            protocolMapper: oidc-group-membership-mapper
            config:
              claim.name: groups
              # `false` => `k8s-admins` and not `/k8s-admins`. Kubernetes RBAC bindings compare
              # the string as is: a leading `/` would make every match fail.
              full.path: "false"
              id.token.claim: "true"
              access.token.claim: "true"
              userinfo.token.claim: "true"

    # Scopes assigned by default to every NEW client of the realm. The list REPLACES the
    # realm's own: the built-in scopes must therefore be repeated, otherwise a client created
    # afterwards (the `dex` client, for instance) would lose `profile` and `email` — hence the
    # user's name and address.
    defaultDefaultClientScopes:
      - acr
      - basic
      - email
      - profile
      - roles
      - web-origins
      - groups

    # --- Demo user ------------------------------------------------------------
    # A member of `k8s-admins`: in the `../dex/` scenario, this is the one that gets
    # `cluster-admin` without a single client certificate being handed out.
    users:
      - username: demo
        enabled: true
        email: demo@lab.example.io
        emailVerified: true
        firstName: Demo
        lastName: User
        credentials:
          - type: password
            value: ${DEMO_PASSWORD}
            temporary: false
        groups:
          - /k8s-admins
