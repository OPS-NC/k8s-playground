# 03-realm-lab.yaml — the `lab` realm, declared (the `KeycloakRealmImport` CRD).
#
# A fresh realm takes three clicks in the admin console; declaring it serves another purpose:
# the realm becomes REPRODUCIBLE. Destroy the lab, bring it back up, and the realm returns
# identical — same groups, same `groups` scope, same demo user. That is what lets downstream
# components (see `../dex/`) assume that `lab` exists and that it emits a `groups` claim.
#
# HOW IT WORKS: the operator creates a Job that starts an ephemeral Keycloak with
# `--import-realm` on this representation. The Job runs only once, and the import does NOT
# OVERWRITE an existing realm: re-applying this file therefore undoes nothing you did by hand.
# Corollary: editing this file does NOT modify an already-imported realm — you have to delete
# it (`kubectl -n keycloak delete keycloakrealmimport lab`, then the realm in the console) or
# make the change by hand.
#
# ⚠️ NO PASSWORD HERE. The repository is public. The demo user's password arrives through
#    `placeholders`: the operator exposes the Secret key as an environment variable of the
#    import Job, and Keycloak substitutes `${DEMO_PASSWORD}` at import time. The Secret is
#    generated by `keycloak-up.sh` (openssl), once, and is never printed.
apiVersion: k8s.keycloak.org/v2beta1
kind: KeycloakRealmImport
metadata:
  name: lab
  namespace: keycloak
spec:
  keycloakCRName: keycloak
  placeholders:
    DEMO_PASSWORD:
      secret:
        name: keycloak-demo-user
        key: password
    VIEWER_PASSWORD:
      secret:
        name: keycloak-viewer-user
        key: password
  realm:
    realm: lab
    enabled: true
    displayName: Lab (k8s-playground)
    # No self-registration: on a lab realm reachable behind the VIP, an open sign-up form is a
    # way in, not a feature.
    registrationAllowed: false
    resetPasswordAllowed: true
    loginWithEmailAllowed: true
    # Lockout after repeated failures: the realm is reachable by every authorized Tailscale
    # peer, and a `demo` account with a weak password gets brute-forced.
    bruteForceProtected: true

    # --- Groups: the source of downstream authorisation ----------------------
    # They mean NOTHING inside Keycloak alone — it is the token's consumer that gives them a
    # meaning. In this repository they are the subjects of the ClusterRoleBindings laid down by
    # `../dex/`: `k8s-admins` -> cluster-admin, `k8s-viewers` -> view.
    groups:
      - name: k8s-admins
      - name: k8s-viewers

    # --- Client scopes: NOT declared here, and that is the point -------------
    # A `clientScopes:` key in this representation SUPPRESSES every built-in client scope:
    # Keycloak only runs its own `setupClientScopes()` when the imported realm declares none.
    # Declaring just `groups` here therefore produced a realm with exactly two scopes —
    # `groups` and `offline_access` — and no `profile`, no `email`, no `roles`.
    #
    # The symptom lands three components away and names the wrong culprit: ../dex/ requests
    # `openid profile email groups`, Keycloak refuses the authorization request outright, and
    # the browser never reaches a login form:
    #     error=invalid_scope
    #     Invalid scopes: openid openid profile email groups
    # The message lists EVERY requested scope rather than the missing ones, so it reads as a
    # `groups` problem (and the duplicated `openid` — harmless, Dex prepends its own).
    #
    # So we let Keycloak create its built-ins, and `keycloak-up.sh` adds the one scope that is
    # ours (`groups`) afterwards, with kcadm. Same reason `defaultDefaultClientScopes` is gone:
    # it can only reference scopes that already exist at import time.

    # --- Demo users -----------------------------------------------------------
    # TWO users, because one proves nothing. `demo` gets `cluster-admin` and `viewer` gets
    # `view`, through their group alone — not a single client certificate is handed out, and
    # not one line of RBAC mentions a person (see ../dex/rbac.yaml).
    #
    # `viewer` is what makes the demonstration falsifiable: if both accounts could do the same
    # things, nothing would prove the `groups` claim is actually being read. The check that
    # matters is the one that must FAIL:
    #     kubectl --context=oidc-viewer auth can-i create pods   => no
    #     kubectl --context=oidc-viewer auth can-i list pods      => yes
    #
    # ⚠️ `view` is NOT "read everything": it deliberately excludes Secrets and grants nothing on
    #    cluster-scoped objects. So `kubectl get nodes` is FORBIDDEN for `viewer` — that is the
    #    ClusterRole behaving correctly, not a broken login. Use `get pods` to test.
    #
    # ⚠️ `emailVerified: true` is not cosmetic: the apiserver is wired with
    #    `--oidc-username-claim=email`, so the email IS the Kubernetes identity. An unverified
    #    account whose email Keycloak refuses to emit would authenticate and then be
    #    unidentifiable — `oidc:` with nothing after it.
    users:
      - username: demo
        enabled: true
        email: demo@lab.example.io
        emailVerified: true
        firstName: Demo
        lastName: User
        credentials:
          - type: password
            value: ${DEMO_PASSWORD}
            temporary: false
        groups:
          - /k8s-admins
      - username: viewer
        enabled: true
        email: viewer@lab.example.io
        emailVerified: true
        firstName: View
        lastName: Only
        credentials:
          - type: password
            value: ${VIEWER_PASSWORD}
            temporary: false
        groups:
          - /k8s-viewers
