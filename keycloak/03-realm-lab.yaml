# 03-realm-lab.yaml — le realm `lab`, déclaré (CRD `KeycloakRealmImport`).
#
# Un realm neuf se crée en trois clics dans la console d'admin ; le déclarer sert à
# autre chose : le realm devient REPRODUCTIBLE. Détruire le lab, le remonter, et le
# realm revient identique — mêmes groupes, même scope `groups`, même utilisateur de
# démonstration. C'est ce qui permet aux composants d'aval (cf. `../dex/`) de supposer
# que `lab` existe et qu'il émet un claim `groups`.
#
# COMMENT ÇA MARCHE : l'opérateur crée un Job qui démarre un Keycloak éphémère avec
# `--import-realm` sur cette représentation. Le Job ne tourne qu'une fois, et l'import
# n'ÉCRASE PAS un realm existant : réappliquer ce fichier ne défait donc rien à la main.
# Corollaire : modifier ce fichier ne modifie PAS un realm déjà importé — il faut le
# supprimer (`kubectl -n keycloak delete keycloakrealmimport lab` puis le realm dans la
# console) ou faire le changement à la main.
#
# ⚠️ AUCUN MOT DE PASSE ICI. Le dépôt est public. Le mot de passe de l'utilisateur de
#    démonstration arrive par `placeholders` : l'opérateur expose la clé du Secret comme
#    variable d'environnement du Job d'import, et Keycloak substitue `${DEMO_PASSWORD}`
#    au moment de l'import. Le Secret est généré par `keycloak-up.sh` (openssl), une
#    seule fois, et n'est jamais affiché.
apiVersion: k8s.keycloak.org/v2beta1
kind: KeycloakRealmImport
metadata:
  name: lab
  namespace: keycloak
spec:
  keycloakCRName: keycloak
  placeholders:
    DEMO_PASSWORD:
      secret:
        name: keycloak-demo-user
        key: password
  realm:
    realm: lab
    enabled: true
    displayName: Lab (k8s-playground)
    # Pas d'auto-inscription : sur un realm de lab exposé derrière la VIP, un formulaire
    # d'inscription ouvert est une porte d'entrée, pas une fonctionnalité.
    registrationAllowed: false
    resetPasswordAllowed: true
    loginWithEmailAllowed: true
    # Verrouillage après échecs répétés : le realm est joignable par tous les pairs
    # Tailscale autorisés, un `demo` avec un mot de passe faible se brute-force.
    bruteForceProtected: true

    # --- Groupes : la source des autorisations en aval -----------------------
    # Ils ne servent à RIEN dans Keycloak seul — c'est le consommateur du jeton qui leur
    # donne un sens. Dans ce dépôt, ce sont les sujets des ClusterRoleBinding posés par
    # `../dex/` : `k8s-admins` -> cluster-admin, `k8s-viewers` -> view.
    groups:
      - name: k8s-admins
      - name: k8s-viewers

    # --- Le scope `groups` ----------------------------------------------------
    # Keycloak N'ÉMET PAS l'appartenance aux groupes par défaut : sans ce scope, le jeton
    # ne porte aucun claim `groups` et tout RBAC fondé dessus est muet — sans erreur,
    # juste un « forbidden » inexplicable côté apiserver.
    clientScopes:
      - name: groups
        protocol: openid-connect
        description: Appartenance aux groupes, à plat, dans le claim `groups`
        attributes:
          include.in.token.scope: "true"
          display.on.consent.screen: "false"
        protocolMappers:
          - name: groups
            protocol: openid-connect
            protocolMapper: oidc-group-membership-mapper
            config:
              claim.name: groups
              # `false` => `k8s-admins` et non `/k8s-admins`. Les liaisons RBAC de
              # Kubernetes comparent la chaîne telle quelle : un `/` de tête ferait
              # échouer toutes les correspondances.
              full.path: "false"
              id.token.claim: "true"
              access.token.claim: "true"
              userinfo.token.claim: "true"

    # Scopes attribués d'office à tout NOUVEAU client du realm. La liste REMPLACE celle
    # du realm : les scopes intégrés doivent donc y être répétés, sinon un client créé
    # ensuite (le client `dex`, par exemple) perdrait `profile` et `email` — donc le nom
    # et l'adresse de l'utilisateur.
    defaultDefaultClientScopes:
      - acr
      - basic
      - email
      - profile
      - roles
      - web-origins
      - groups

    # --- Utilisateur de démonstration ----------------------------------------
    # Membre de `k8s-admins` : c'est lui qui, dans le scénario de `../dex/`, obtient
    # `cluster-admin` sans qu'aucun certificat client ne soit distribué.
    users:
      - username: demo
        enabled: true
        email: demo@lab.example.io
        emailVerified: true
        firstName: Demo
        lastName: User
        credentials:
          - type: password
            value: ${DEMO_PASSWORD}
            temporary: false
        groups:
          - /k8s-admins
