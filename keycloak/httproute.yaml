# Exposes Keycloak's admin console and OIDC endpoints over HTTPS at
# `keycloak.lab.example.io`, behind `main-gateway` (Envoy Gateway). TLS is the
# `*.lab.example.io` wildcard already carried by the `https` listener — no Certificate to
# create, the wildcard covers `keycloak.lab.example.io`.
#
# The route lives in the `keycloak` namespace but attaches to the Gateway of the
# `envoy-gateway-system` namespace: possible because `main-gateway` opens its listeners to
# `from: All`. Backend in the same namespace as the route → no ReferenceGrant.
#
# ⚠️ The hostname must be EXACTLY the one in `spec.hostname.hostname` of the Keycloak CR
#    (02-keycloak.yaml). Any discrepancy and the issuer advertised in
#    `/realms/lab/.well-known/openid-configuration` no longer matches the URL actually called:
#    every OIDC client then rejects the tokens ("issuer mismatch").
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak
  namespace: keycloak
spec:
  parentRefs:
    - name: main-gateway
      namespace: envoy-gateway-system
      sectionName: https          # targets the TLS :443 listener
  hostnames:
    - keycloak.lab.example.io    # matches the *.lab.example.io wildcard
  rules:
    - backendRefs:
        # `keycloak-service` is created by the operator (the CR name + `-service`); port 8080
        # only exists because `http.httpEnabled: true` — Envoy does the HTTPS in front,
        # Keycloak speaks plaintext behind.
        - name: keycloak-service
          port: 8080
