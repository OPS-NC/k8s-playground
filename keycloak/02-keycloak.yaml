# 02-keycloak.yaml — le CR `Keycloak`, c'est-à-dire TOUT le déploiement.
#
# On ne pose ici ni Deployment, ni StatefulSet, ni Service, ni ConfigMap : l'opérateur
# Keycloak les dérive de ce seul objet, et les reconcilie en continu. Modifier le
# StatefulSet à la main ne sert donc à rien — l'opérateur le remet comme il l'entend.
# Tout réglage passe par ce CR (ou, en dernier recours, par `spec.additionalOptions`).
#
# ⚠️ LE point de montage du lab : **Envoy termine le TLS, Keycloak parle en clair**.
#    - `http.httpEnabled: true`  -> le pod écoute en HTTP sur 8080 (Service
#      `keycloak-service:8080`), et l'opérateur n'exige plus de certificat serveur ;
#    - `proxy.headers: xforwarded` -> Keycloak fait CONFIANCE aux en-têtes
#      `X-Forwarded-*` posés par Envoy. Sans ça, il croit être joint en HTTP sur son nom
#      interne et fabrique des URL de redirection en `http://keycloak-service:8080/...`
#      -> le navigateur boucle, et OAuth casse (le `redirect_uri` ne correspond plus) ;
#    - `hostname.hostname` -> l'URL PUBLIQUE, celle qui doit apparaître dans l'issuer
#      (`https://keycloak.<domaine>/realms/<realm>`), les métadonnées OIDC et tous les
#      liens. C'est elle que les clients OIDC (Dex, kubectl) valideront.
#
# ⚠️ `proxy.headers: xforwarded` n'est SÛR que parce que le pod n'est joignable que par
#    la Gateway (ClusterIP + HTTPRoute). Exposer ce Service directement laisserait
#    n'importe qui usurper `X-Forwarded-Host` et empoisonner les liens de reset de mot
#    de passe. Cf. la section « Pièges » du README.
apiVersion: k8s.keycloak.org/v2beta1
kind: Keycloak
metadata:
  name: keycloak
  namespace: keycloak
spec:
  # 1 instance : Keycloak en HA exige un cache Infinispan distribué correctement réglé,
  # ce qui n'apporte rien sur des workers de lab. Monter ce nombre demande d'abord de
  # lire la doc « Configuring distributed caches » de l'amont.
  instances: 1

  # --- Base de données (cf. 01-postgres.yaml) --------------------------------
  # `keycloak-db-rw` est le Service CNPG qui pointe TOUJOURS le primaire — jamais l'IP
  # d'un pod, qui changerait au moindre failover.
  db:
    vendor: postgres
    host: keycloak-db-rw
    port: 5432
    database: keycloak
    usernameSecret:
      name: keycloak-db-app
      key: username
    passwordSecret:
      name: keycloak-db-app
      key: password

  # --- Exposition -------------------------------------------------------------
  http:
    httpEnabled: true
  hostname:
    hostname: https://keycloak.lab.example.io
  proxy:
    headers: xforwarded
  # L'opérateur crée un Ingress par défaut. On le coupe : ce dépôt expose tout par la
  # Gateway API (`httproute.yaml`), et il n'y a d'ailleurs aucun contrôleur Ingress ici.
  ingress:
    enabled: false

  # --- Ressources -------------------------------------------------------------
  # Keycloak 26 est un binaire Quarkus : ~700 Mio au repos, plus au premier démarrage
  # (augmentation du schéma de base). En dessous de 1 Gio de limite, l'OOMKill arrive
  # pendant la migration Liquibase — panne illisible, base à moitié migrée.
  resources:
    requests:
      memory: 768Mi
      cpu: 200m
    limits:
      memory: 1280Mi
