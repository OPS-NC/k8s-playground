# 02-keycloak.yaml — the `Keycloak` CR, that is to say the WHOLE deployment.
#
# We lay down neither a Deployment, nor a StatefulSet, nor a Service, nor a ConfigMap here: the
# Keycloak operator derives them from this single object, and reconciles them continuously.
# Editing the StatefulSet by hand is therefore pointless — the operator puts it back the way it
# wants. Every setting goes through this CR (or, as a last resort, through
# `spec.additionalOptions`).
#
# ⚠️ THE key point of the lab setup: **Envoy terminates TLS, Keycloak speaks plaintext**.
#    - `http.httpEnabled: true`  -> the pod listens over HTTP on 8080 (Service
#      `keycloak-service:8080`), and the operator no longer requires a server certificate;
#    - `proxy.headers: xforwarded` -> Keycloak TRUSTS the `X-Forwarded-*` headers set by Envoy.
#      Without it, it believes it is being reached over HTTP on its internal name and builds
#      redirect URLs like `http://keycloak-service:8080/...` -> the browser loops, and OAuth
#      breaks (the `redirect_uri` no longer matches);
#    - `hostname.hostname` -> the PUBLIC URL, the one that must appear in the issuer
#      (`https://keycloak.<domain>/realms/<realm>`), in the OIDC metadata and in every link.
#      It is the one OIDC clients (Dex, kubectl) will validate.
#
# ⚠️ `proxy.headers: xforwarded` is only SAFE because the pod is reachable through the Gateway
#    alone (ClusterIP + HTTPRoute). Exposing this Service directly would let anyone spoof
#    `X-Forwarded-Host` and poison the password-reset links. See the README's "Pitfalls".
apiVersion: k8s.keycloak.org/v2beta1
kind: Keycloak
metadata:
  name: keycloak
  namespace: keycloak
spec:
  # 1 instance: Keycloak in HA requires a properly tuned distributed Infinispan cache, which
  # brings nothing on lab workers. Raising this number means first reading the upstream
  # "Configuring distributed caches" guide.
  instances: 1

  # --- Database (see 01-postgres.yaml) --------------------------------------
  # `keycloak-db-rw` is the CNPG Service that ALWAYS points at the primary — never a pod IP,
  # which would change on the slightest failover.
  db:
    vendor: postgres
    host: keycloak-db-rw
    port: 5432
    database: keycloak
    usernameSecret:
      name: keycloak-db-app
      key: username
    passwordSecret:
      name: keycloak-db-app
      key: password

  # --- Exposure ---------------------------------------------------------------
  http:
    httpEnabled: true
  hostname:
    hostname: https://keycloak.lab.example.io
  proxy:
    headers: xforwarded
  # The operator creates an Ingress by default. We turn it off: this repository exposes
  # everything through the Gateway API (`httproute.yaml`), and there is no Ingress controller
  # here anyway.
  ingress:
    enabled: false

  # --- Server features --------------------------------------------------------
  # ⚠️ REQUIRED BY THE `KeycloakOIDCClient` CRD — and its absence fails in a way that is very
  #    easy to miss. Declaring a client (../dex/01-keycloak-client.yaml) applies cleanly,
  #    `kubectl apply` says `configured`, the object exists… and it is never reconciled:
  #        status.conditions: HasErrors=True
  #        "Cannot create/update because the server does not have client-admin-api:v2 enabled"
  #    The client is simply never created in the realm. Nothing crashes, no pod is unhealthy —
  #    the failure only shows up much later, at login, as an `invalid_client`.
  #    `dex-up.sh` waits on `condition=Ready` with a `|| true`, so it swallows the timeout and
  #    carries on: the wait costs 180 s and proves nothing.
  #
  # The operator drives clients through the v2 admin API, which is still behind a feature flag
  # in Keycloak 26.x. Enabling it restarts the pod (the operator rolls the StatefulSet).
  #
  # ⚠️ NOT SUFFICIENT ON ITS OWN — measured on Keycloak 26.7.0, 2026-08-01:
  #   1. The OPERATOR caches the server's feature list. After enabling the flag, the server
  #      really does log `Experimental features enabled: client-admin-api:v2`, yet the operator
  #      keeps reporting `the server does not have client-admin-api:v2 enabled` until it is
  #      restarted itself:
  #          kubectl -n keycloak rollout restart deploy/keycloak-operator
  #      A fresh install is fine (the operator starts after the server), so this only bites when
  #      the flag is added to a LIVE Keycloak.
  #   2. Once past that, `KeycloakClientBaseController` looks up a Secret named
  #      `<keycloak-cr-name>-admin` (here `keycloak-admin`) for the credentials it uses against
  #      the admin API — and the operator's own bootstrap Secret is `keycloak-initial-admin`, a
  #      DIFFERENT name. Creating `keycloak-admin` with `username`/`password` is not enough
  #      either: the controller then dies on a NullPointerException
  #      (`Cannot invoke "String.getBytes(...)" because "src" is null`), so it wants other keys
  #      — most likely a service account (`client-id`/`client-secret`, cf.
  #      `spec.bootstrapAdmin.service.secret`) rather than a user.
  #      ⇒ STILL UNRESOLVED. Until it is, `KeycloakOIDCClient` objects apply cleanly and are
  #        never reconciled, so ../dex/ installs and starts but its login ends in
  #        `invalid_client`. Do not treat this block as "clients work now".
  features:
    enabled:
      - client-admin-api:v2

  # --- Resources --------------------------------------------------------------
  # Keycloak 26 is a Quarkus binary: ~700 MiB at rest, more on the first start (the database
  # schema upgrade). Below a 1 GiB limit, the OOMKill lands during the Liquibase migration —
  # an unreadable failure, with a half-migrated database.
  resources:
    requests:
      memory: 768Mi
      cpu: 200m
    limits:
      memory: 1280Mi
