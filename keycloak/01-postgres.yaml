# 01-postgres.yaml — Keycloak's PostgreSQL database, managed by CloudNativePG.
#
# Keycloak stores EVERYTHING in the database: realms, clients, users, offline sessions.
# Without an external database it starts from scratch on every pod restart (the `dev-file`
# mode does not survive the pod, and the operator refuses it in production). This database is
# therefore a hard prerequisite, not an option.
#
# Why CloudNativePG rather than a home-made `postgres:17` Deployment: the operator is ALREADY
# in this repository (see ../cloudnative-pg/), it handles failover, backups and credential
# rotation, and it produces on its own the `keycloak-db-app` Secret the Keycloak CR references
# just below. One more component to install, zero PostgreSQL manifest to maintain here.
#
# A single instance: this is a lab, and PostgreSQL replication brings nothing while Keycloak
# itself runs as a single copy. `../cloudnative-pg/cluster-demo.yaml` shows the 3-node HA
# version.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: keycloak-db
  namespace: keycloak
spec:
  instances: 1

  # `longhorn-r1` = 1 block replica. It is this repository's base SC for databases: redundancy
  # is played at the application level (here: nowhere, a single instance), not by stacking 3
  # Longhorn copies under each instance — the workers' OS disk is 20 GB.
  storage:
    size: 2Gi
    storageClass: longhorn-r1

  # Sized for 4 GB workers (see WK_MEM in lab.env), taking into account that Keycloak (~1 GB)
  # runs on the same nodes.
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi

  postgresql:
    parameters:
      max_connections: "100"
      shared_buffers: "128MB"

  # PodMonitor disabled until kube-prometheus-stack is installed (see ../observability/):
  # otherwise the operator creates a PodMonitor with no CRD behind it.
  monitoring:
    enablePodMonitor: false

  # EXPLICIT database and owner: without this CNPG creates the `app` database and the `app`
  # user, and the Keycloak CR would have to point there. We prefer names that say what they
  # are. The produced Secret keeps the name derived from the cluster: `keycloak-db-app`
  # (keys `username`, `password`, `host`, `dbname`, `uri`).
  bootstrap:
    initdb:
      database: keycloak
      owner: keycloak
