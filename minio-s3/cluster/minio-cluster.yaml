# minio-cluster.yaml — DISTRIBUTED 4-node MinIO (erasure coding) — Talos / kubeadm labs.
#
# 4 StatefulSet pods, 1 drive (a local-path PVC) per pod, 1 pod per worker (anti-affinity):
# MinIO erasure-codes the objects across the 4 drives → RESILIENT (tolerates losing ~2 nodes)
# WITHOUT Longhorn: MinIO replicates itself (like CNPG does for Postgres).
#
# Why 4 (and not 3): MinIO requires a minimum of 4 drives per erasure set, spread UNIFORMLY.
# 4 drives over 3 nodes does not distribute uniformly → not viable. With 1 drive/pod, that
# means 4 pods = 4 nodes. (3 nodes is only possible with >=2 drives/node.)
#
# Dedicated `minio-cluster` namespace (coexists with the standalone MinIO of ../). Exposed on:
#   - API S3   : https://minio-cluster.lab.example.io          (9000)
#   - Console  : https://minio-cluster-console.lab.example.io  (9001, admin — image pigsty)
#
# The `minio-creds` Secret (root user/password) is created by minio-cluster-up.sh (outside this manifest).
---
apiVersion: v1
kind: Namespace
metadata:
  name: minio-cluster
---
# HEADLESS Service: gives each pod a stable DNS name minio-N.minio-hl... (peer discovery).
apiVersion: v1
kind: Service
metadata:
  name: minio-hl
  namespace: minio-cluster
  labels: { app: minio-cluster }
spec:
  clusterIP: None
  publishNotReadyAddresses: true      # peers must resolve BEFORE they are "ready"
  selector: { app: minio-cluster }
  ports:
    - { name: api, port: 9000 }
    - { name: console, port: 9001 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  namespace: minio-cluster
  labels: { app: minio-cluster }
spec:
  serviceName: minio-hl
  replicas: 4
  podManagementPolicy: Parallel       # CRUCIAL: the 4 pods start TOGETHER (they wait for each other)
  selector:
    matchLabels: { app: minio-cluster }
  template:
    metadata:
      labels: { app: minio-cluster }
      annotations:
        # Same reason as the standalone (../minio-s3.yaml): this namespace is the repository's
        # designated Velero target, and `defaultVolumesToFsBackup: true` would have Velero copy
        # each of the FOUR 10 Gi drives — which already hold every previous backup — back into
        # itself. Excluding the drive keeps the manifests and the `minio-creds` Secret in the
        # backup, which is what you need to rebuild MinIO before restoring anything else.
        backup.velero.io/backup-volumes-excludes: data
    spec:
      securityContext: { runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000 }
      # 1 pod per node (node-local drive) → erasure coding spread over 4 distinct workers.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels: { app: minio-cluster }
              topologyKey: kubernetes.io/hostname
      containers:
        - name: minio
          image: docker.io/pgsty/minio:RELEASE.2026-06-18T00-00-00Z   # Pigsty fork (recent + admin console)
          args:
            - server
            # MinIO ellipsis expansion: the 4 peers minio-0..3 through the headless service.
            - http://minio-{0...3}.minio-hl.minio-cluster.svc.cluster.local:9000/data
            - --console-address
            - ":9001"
          env:
            - name: MINIO_ROOT_USER
              valueFrom: { secretKeyRef: { name: minio-creds, key: root-user } }
            - name: MINIO_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: minio-creds, key: root-password } }
            - name: MINIO_BROWSER_REDIRECT_URL
              value: https://minio-cluster-console.lab.example.io
          ports:
            - { name: api, containerPort: 9000 }
            - { name: console, containerPort: 9001 }
          startupProbe:                # gives the quorum time to form at boot
            httpGet: { path: /minio/health/live, port: api }
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /minio/health/live, port: api }
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /minio/health/ready, port: api }
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
          volumeMounts:
            - { name: data, mountPath: /data }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests:
            storage: 10Gi
---
# CLIENT Service (ClusterIP): balances across the 4 pods, the target of the HTTPRoutes.
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: minio-cluster
  labels: { app: minio-cluster }
spec:
  type: ClusterIP
  selector: { app: minio-cluster }
  ports:
    - { name: api, port: 9000, targetPort: api }
    - { name: console, port: 9001, targetPort: console }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: minio-cluster-api
  namespace: minio-cluster
spec:
  parentRefs:
    - { name: main-gateway, namespace: envoy-gateway-system, sectionName: https }
  hostnames: [minio-cluster.lab.example.io]
  rules:
    - backendRefs: [{ name: minio, port: 9000 }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: minio-cluster-console
  namespace: minio-cluster
spec:
  parentRefs:
    - { name: main-gateway, namespace: envoy-gateway-system, sectionName: https }
  hostnames: [minio-cluster-console.lab.example.io]
  rules:
    - backendRefs: [{ name: minio, port: 9001 }]
