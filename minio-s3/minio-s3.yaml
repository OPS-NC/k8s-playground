# minio-s3.yaml — MinIO (stockage objet compatible S3) en standalone (labs Talos / kubeadm).
#
# Image = the PIGSTY FORK (pgsty/minio) — NOT the Bitnami chart (its free images are frozen on
# `bitnamilegacy`), and NOT upstream minio/minio (an ARCHIVED repository, "no longer
# maintained" as of Feb 2026, with an amputated console since mid-2025). Pigsty rebuilds the
# MinIO server AND restores the full ADMIN CONSOLE → we get BOTH the recent build AND the
# admin UI.
# Storage: 1 local-path PVC (node-local, no Longhorn). Exposed over HTTPS through
# main-gateway:
#   - API S3   : https://minio.lab.example.io          (port 9000)
#   - Console : https://minio-console.lab.example.io  (port 9001, full admin)
#
# Alternatives (README): upstream pinned to RELEASE.2025-04-22 (the last official admin
# console), other console forks (huncrys, georgmangold), or the paid AIStor edition.
#
# The `minio-creds` Secret (root user/password) is created by minio-up.sh (outside this
# manifest, so that no credential is ever committed).
---
apiVersion: v1
kind: Namespace
metadata:
  name: minio-s3
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
  namespace: minio-s3
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: minio-s3
  labels: { app: minio }
spec:
  replicas: 1
  strategy:
    type: Recreate            # RWO local-path: never two pods on the same volume
  selector:
    matchLabels: { app: minio }
  template:
    metadata:
      labels: { app: minio }
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: minio
          image: docker.io/pgsty/minio:RELEASE.2026-06-18T00-00-00Z   # Pigsty fork: recent + admin console
          args:
            - server
            - /data
            - --console-address
            - ":9001"
          env:
            - name: MINIO_ROOT_USER
              valueFrom: { secretKeyRef: { name: minio-creds, key: root-user } }
            - name: MINIO_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: minio-creds, key: root-password } }
            # Console redirect behind the reverse proxy (a hostname distinct from the API).
            - name: MINIO_BROWSER_REDIRECT_URL
              value: https://minio-console.lab.example.io
          ports:
            - { name: api,     containerPort: 9000 }
            - { name: console, containerPort: 9001 }
          readinessProbe:
            httpGet: { path: /minio/health/ready, port: api }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /minio/health/live, port: api }
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minio-data
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: minio-s3
  labels: { app: minio }
spec:
  type: ClusterIP
  selector: { app: minio }
  ports:
    - { name: api,     port: 9000, targetPort: api }
    - { name: console, port: 9001, targetPort: console }
---
# API S3 -> port 9000
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: minio-api
  namespace: minio-s3
spec:
  parentRefs:
    - name: main-gateway
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - minio.lab.example.io
  rules:
    - backendRefs:
        - name: minio
          port: 9000
---
# Console (navigateur d'objets) -> port 9001
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: minio-console
  namespace: minio-s3
spec:
  parentRefs:
    - name: main-gateway
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - minio-console.lab.example.io
  rules:
    - backendRefs:
        - name: minio
          port: 9001
