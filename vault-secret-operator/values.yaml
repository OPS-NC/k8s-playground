# Helm values for the Vault Secrets Operator (hashicorp/vault-secrets-operator chart).
# Doc : https://developer.hashicorp.com/vault/docs/deploy/kubernetes/vso/installation

# --- Default VaultConnection ----------------------------------------------------
# Lays down ONE VaultConnection named "default" at install time: the CRs that do not specify a
# vaultConnectionRef use it. Avoids repeating the address everywhere.
defaultVaultConnection:
  enabled: true
  # Address of the Vault server. In-cluster (hashicorp/vault chart in the "vault" ns):
  address: "http://vault.vault.svc.cluster.local:8200"
  # External / exposed by the lab's Gateway: "https://vault.lab.example.io"
  # Over HTTPS with a private CA, reference the Secret holding the CA (key "ca.crt"):
  # caCertSecret: "vault-ca"
  # skipTLSVerify=true: LAB ONLY (accepts any certificate). DO NOT do this anywhere else.
  skipTLSVerify: false

# --- Default auth method --------------------------------------------------------
# We prefer an explicit VaultAuth per namespace (k8s/02-vaultauth.yaml), more readable and
# multi-tenant. So we leave the default disabled. Uncomment for a single-app cluster.
defaultAuthMethod:
  enabled: false
  # namespace: ""            # Vault namespace (Vault Enterprise / HCP)
  # method: kubernetes
  # mount: kubernetes        # path of the auth mount (auth/kubernetes)
  # kubernetes:
  #   role: vso-static       # Vault role (see vault/02-roles.sh)
  #   serviceAccount: default
  #   tokenAudiences: ["vault"]

controller:
  manager:
    # --- Client cache + cache encryption ---------------------------------------
    # persistenceModel:
    #   none              -> in-RAM cache; an operator restart LOSES the leases of the
    #                        dynamic credentials (orphan credentials on the Vault side).
    #   direct-encrypted  -> cache persisted AND encrypted through Vault's Transit engine.
    #                        Leases survive a restart -> no orphans. Recommended.
    clientCache:
      # "none": in-RAM cache, with no dependency on Vault's Transit engine. Enough for
      # STATIC secrets (no dynamic leases to preserve). Switch back to "direct-encrypted"
      # (+ storageEncryption.enabled=true + the transit engine + the vso-transit role) the
      # day you synchronise dynamic credentials (DB, short-lived PKI).
      persistenceModel: "none"
      cacheSize: 10000
      storageEncryption:
        enabled: false
        # The cache is encrypted by a dedicated Transit key (see
        # vault/policies/vso-transit-cache.hcl and vault/00-secrets-engines.sh). The operator
        # authenticates for that encryption through ITS OWN ServiceAccount and a dedicated
        # Vault role (vso-transit).
        vaultConnectionRef: default
        method: kubernetes
        mount: kubernetes
        transitMount: transit
        keyName: vso-client-cache
        role: vso-transit
        # namespace: ""     # Vault namespace if Enterprise/HCP

# --- Telemetry (optional, if the Prometheus Operator is present) ----------------
telemetry:
  serviceMonitor:
    enabled: false          # switch to true once the Prometheus operator + its CRDs are installed
