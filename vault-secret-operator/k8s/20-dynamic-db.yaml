# VaultDynamicSecret: generates EPHEMERAL credentials (a database here) -> a K8s Secret.
# Vault creates a temporary user/password pair (a lease) on demand; VSO renews it before it
# expires (renewalPercent) and revokes it on deletion (revoke). No long-lived credential to
# manage.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultDynamicSecret
metadata:
  name: dynamic-db
  namespace: demo
spec:
  vaultAuthRef: vault-auth-dynamic    # -> role Vault vso-dynamic -> policy vso-dynamic-db
  mount: db                           # the database engine mounted on db/
  path: creds/demo-app                # role database (cf. vault/00-secrets-engines.sh)
  # requestHTTPMethod: GET            # the default for creds/; POST if the role takes params
  # params: {}                        # parameters passed to Vault (e.g. ttl)
  renewalPercent: 67                  # renews the lease at 67 % of its lifetime (before expiry)
  revoke: true                        # revokes the lease when this CR is deleted
  allowStaticCreds: false             # true only for "static roles" (rotation done by Vault)
  rolloutRestartTargets:
    - kind: Deployment
      name: demo-app                  # restarts the app on every credential rotation
  destination:
    create: true
    name: dynamic-db                  # produced Secret: username / password keys (+ lease info)
