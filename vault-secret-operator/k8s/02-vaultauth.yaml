# VaultAuth: HOW to authenticate to Vault. Here, the "kubernetes" method.
# One VaultAuth per use case/role, to stay at least privilege (each Vault*Secret points at the
# VaultAuth matching its own Vault role through spec.vaultAuthRef).
#
# The set of values that must be consistent with Vault:
#   mount             == path of the auth mount on the Vault side ("kubernetes" -> auth/kubernetes)
#   kubernetes.role   == name of the Vault role (vault/02-roles.sh)
#   serviceAccount    \_ must match the role's bound_service_account_*
#   (the CR's namespace) /
#   audiences         == audience of the Vault role ("vault")
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vault-auth-static
  namespace: demo
spec:
  vaultConnectionRef: vault-conn      # or omit it to use the "default" from values.yaml
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: vso-static
    serviceAccount: vso-app
    audiences:
      - vault
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vault-auth-dynamic
  namespace: demo
spec:
  vaultConnectionRef: vault-conn
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: vso-dynamic
    serviceAccount: vso-app
    audiences:
      - vault
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vault-auth-pki
  namespace: demo
spec:
  vaultConnectionRef: vault-conn
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: vso-pki
    serviceAccount: vso-app
    audiences:
      - vault
