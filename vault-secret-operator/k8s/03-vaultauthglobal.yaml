# VaultAuthGlobal: shares the auth configuration across several namespaces (DRY, multi-tenant).
# Instead of repeating method/mount/connection in every VaultAuth, we centralise it here and
# each VaultAuth only brings what is specific to it (the role) through vaultAuthGlobalRef.
# The 2026 state of the art for a multi-team cluster. Optional for a single-app lab.
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuthGlobal
metadata:
  name: global-kubernetes
  namespace: vault-secrets-operator      # the "trusted" namespace hosting the global object
spec:
  vaultConnectionRef: default            # the VaultConnection laid down by values.yaml
  defaultAuthMethod: kubernetes
  defaultMount: kubernetes
  # Restricts WHICH K8s namespaces may reference this global object (multi-tenant scoping).
  allowedNamespaces:
    - demo
  kubernetes:
    serviceAccount: vso-app
    audiences:
      - vault
---
# A "light" VaultAuth that inherits from the global object and only adds its role.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vault-auth-static-global
  namespace: demo
spec:
  vaultAuthGlobalRef:
    name: global-kubernetes
    namespace: vault-secrets-operator
  kubernetes:
    role: vso-static           # only the role is specific; the rest comes from the global
