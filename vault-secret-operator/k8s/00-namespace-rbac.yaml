# Application namespace + the ServiceAccount VSO will use to log in to Vault.
# The SA name ("vso-app") and the namespace ("demo") MUST match the Vault role
# (bound_service_account_names / bound_service_account_namespaces, cf. vault/02-roles.sh).
apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
# This ServiceAccount's token is the "key" presented to Vault. No secret is stored in it:
# VSO requests a projected token (audience "vault") on the fly at login time.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vso-app
  namespace: demo
