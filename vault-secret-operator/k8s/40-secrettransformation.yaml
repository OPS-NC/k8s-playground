# SecretTransformation: reshapes the Vault data BEFORE the K8s Secret is written.
# Useful when an application expects a specific format (a .env file, an assembled connection
# URL, a renamed key...). This transformation is referenced from a Vault*Secret's
# destination.transformation.
apiVersion: secrets.hashicorp.com/v1beta1
kind: SecretTransformation
metadata:
  name: app-env
  namespace: demo
spec:
  # Templates: each key produced in the final Secret. .Secrets = the raw data from Vault.
  templates:
    # Assembles a connection URL from the dynamic credentials (dynamic-db).
    DATABASE_URL:
      text: 'postgresql://{{- .Secrets.username -}}:{{- .Secrets.password -}}@postgres.demo.svc:5432/app'
    # Copies/renames a key as is.
    APP_PASSWORD:
      text: '{{ .Secrets.password }}'
  # excludeRaw=true: do NOT copy Vault's raw keys into the Secret (templates only).
  excludeRaw: true
---
# An example VaultStaticSecret that uses the transformation above.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: static-kv-templated
  namespace: demo
spec:
  vaultAuthRef: vault-auth-static
  type: kv-v2
  mount: kvv2
  path: demo/app
  refreshAfter: 60s
  destination:
    create: true
    name: app-env
    transformation:
      transformationRefs:
        - name: app-env
