# A demo app that CONSUMES the Secrets produced by VSO as ordinary K8s Secrets.
# It never talks to Vault. It is the target of the rolloutRestartTargets: when a secret is
# rotated, VSO patches this Deployment (an annotation) -> rollout -> the pod re-reads the new
# values.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels: { app: demo-app }
  template:
    metadata:
      labels: { app: demo-app }
    spec:
      serviceAccountName: vso-app          # (optional here: VSO logs in, not the pod)
      containers:
        - name: app
          image: busybox:1.38
          command: ["sh", "-c", "env | grep -E 'DB_|APP_' ; sleep 3600"]
          # Static KV injected as environment variables (the "static-kv" Secret).
          envFrom:
            - secretRef:
                name: static-kv
          env:
            # Dynamic DB credential, key by key (the "dynamic-db" Secret).
            - name: DB_USER
              valueFrom:
                secretKeyRef: { name: dynamic-db, key: username }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: dynamic-db, key: password }
          volumeMounts:
            # PKI certificate mounted as files (the "pki-tls" Secret: tls.crt / tls.key).
            - name: tls
              mountPath: /etc/tls
              readOnly: true
      volumes:
        - name: tls
          secret:
            secretName: pki-tls
