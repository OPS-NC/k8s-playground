# VaultPKISecret: issues a TLS certificate through Vault's PKI engine -> a kubernetes.io/tls
# Secret. VSO re-issues automatically BEFORE expiry (expiryOffset): certificate rotation with
# no intervention.
#
# Difference with cert-manager (../cert-manager/): cert-manager = PUBLIC certs (Let's Encrypt,
# exposition Internet). VaultPKISecret = PKI PRIVÉE interne (mTLS entre services, CA maison Vault).
# Les deux coexistent : Let's Encrypt en bordure, PKI Vault en interne.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultPKISecret
metadata:
  name: pki-tls
  namespace: demo
spec:
  vaultAuthRef: vault-auth-pki        # -> role Vault vso-pki -> policy vso-pki
  mount: pki                          # the pki engine mounted on pki/
  role: demo                          # PKI role (bounds domains/lifetimes, see 00-secrets-engines.sh)
  commonName: demo-app.lab.example.io     # cert CN (must stay within the role's allowed_domains)
  # altNames: demo-app.demo.svc       # additional DNS SANs
  format: pem
  ttl: 24h                            # certificate lifetime
  expiryOffset: 1h                    # re-issues 1h before expiry
  revoke: true                        # revokes when the CR is deleted
  clear: true                         # empties the Secret on deletion
  destination:
    create: true
    name: pki-tls
    type: kubernetes.io/tls           # -> tls.crt / tls.key keys (consumable by an Ingress/Gateway)
