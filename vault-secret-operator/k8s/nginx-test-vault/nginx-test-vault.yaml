# End-to-end VSO demo: a Vault secret (lab-kv/nginx-test-vault/config) synchronised into a
# K8s Secret, injected as environment variables into nginx, with an AUTOMATIC RESTART of the
# Deployment when the secret changes in Vault (rolloutRestartTargets + refreshAfter).
#
# Prerequisites: the VSO operator deployed + ./vault/lab-kv.sh executed (engine + role + secret).
---
apiVersion: v1
kind: Namespace
metadata:
  name: nginx-test-vault
---
# The SA presented to Vault. Must match the nginx-test-vault role (bound_service_account_*).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nginx-test-vault
  namespace: nginx-test-vault
---
# HOW to authenticate to Vault (the kubernetes method, the nginx-test-vault role).
# No vaultConnectionRef -> uses the operator's "default" VaultConnection
# (values.yaml : http://vault.vault.svc.cluster.local:8200).
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: nginx-test-vault
  namespace: nginx-test-vault
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: nginx-test-vault
    serviceAccount: nginx-test-vault
    audiences:
      - vault
---
# QUOI synchroniser : lab-kv/nginx-test-vault/config (KV-v2) -> Secret K8s "nginx-test-vault-config".
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: nginx-test-vault-config
  namespace: nginx-test-vault
spec:
  vaultAuthRef: nginx-test-vault
  type: kv-v2
  mount: lab-kv
  path: nginx-test-vault/config
  refreshAfter: 30s              # VSO re-reads Vault every 30s
  hmacSecretData: true           # detects drift without logging the values
  # The heart of the matter: when the Secret changes, VSO restarts these targets.
  rolloutRestartTargets:
    - kind: Deployment
      name: nginx-test-vault
  destination:
    create: true                 # VSO creates/maintains the Secret
    name: nginx-test-vault-config
---
# The application: nginx receiving the secret as environment variables (envFrom).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-test-vault
  namespace: nginx-test-vault
  labels: { app: nginx-test-vault }
spec:
  replicas: 2
  selector:
    matchLabels: { app: nginx-test-vault }
  template:
    metadata:
      labels: { app: nginx-test-vault }
    spec:
      serviceAccountName: nginx-test-vault
      containers:
        - name: nginx
          image: nginx:1.30-alpine
          envFrom:
            - secretRef:
                name: nginx-test-vault-config    # APP_GREETING / APP_COLOR / APP_SECRET_TOKEN
          ports:
            - containerPort: 80
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { memory: 96Mi }
