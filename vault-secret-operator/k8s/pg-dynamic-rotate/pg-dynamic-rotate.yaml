# VSO demo — PostgreSQL PASSWORD ROTATION driven by Vault (a database static role).
#
# Vault manages the password of the fixed PG user `vault-rotate` (database engine, static
# role) and rotates it every 2 min. VSO reads `database/static-creds/vault-rotate`, derives a
# complete CONNECTION STRING from it (SecretTransformation), writes it into the
# `pg-rotate-creds` K8s Secret, and RESTARTS the alpine Deployment on every rotation
# (rolloutRestartTargets).
#
# Prerequisites: the VSO operator deployed + ./vault/pg-dynamic-rotate.sh executed (database engine,
# connexion admin CNPG, static role, policy, role k8s) + cluster CloudNativePG `pg-demo`.
---
apiVersion: v1
kind: Namespace
metadata:
  name: pg-rotate-demo
---
# The SA presented to Vault. Must match the pg-rotate-demo Vault role (bound_service_account_*).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pg-rotate
  namespace: pg-rotate-demo
---
# HOW to authenticate to Vault (the kubernetes method, the pg-rotate-demo role, audience vault).
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: pg-rotate
  namespace: pg-rotate-demo
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: pg-rotate-demo
    serviceAccount: pg-rotate
    audiences:
      - vault
---
# Reshapes the raw static-creds data (username/password) into ready-to-use ENV variables: a
# complete DSN string + the PG* components (psql/libpq compatible).
apiVersion: secrets.hashicorp.com/v1beta1
kind: SecretTransformation
metadata:
  name: pg-rotate-dsn
  namespace: pg-rotate-demo
spec:
  templates:
    DATABASE_URL:
      text: 'postgresql://{{ .Secrets.username }}:{{ .Secrets.password }}@pg-demo-rw.cnpg-demo.svc.cluster.local:5432/vault?sslmode=require'
    PGHOST:
      text: 'pg-demo-rw.cnpg-demo.svc.cluster.local'
    PGPORT:
      text: '5432'
    PGDATABASE:
      text: 'vault'
    PGUSER:
      text: '{{ .Secrets.username }}'
    PGPASSWORD:
      text: '{{ .Secrets.password }}'
---
# WHAT to synchronise: the static-creds of the vault-rotate role (database engine).
# allowStaticCreds=true => VSO handles a STATIC ROLE (the rotated password of an existing
# user), and resynchronises at the pace of the rotation (the ttl returned by Vault).
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultDynamicSecret
metadata:
  name: pg-rotate
  namespace: pg-rotate-demo
spec:
  vaultAuthRef: pg-rotate
  mount: database
  path: static-creds/vault-rotate
  allowStaticCreds: true
  destination:
    create: true
    name: pg-rotate-creds
    # Keeps ONLY the templated keys (excludes the raw username/password/ttl/...).
    transformation:
      excludes:
        - ".*"
      transformationRefs:
        - name: pg-rotate-dsn
  # The heart of the matter: on every password rotation, VSO restarts this Deployment.
  rolloutRestartTargets:
    - kind: Deployment
      name: pg-rotate-demo
---
# The test application: an alpine pod receiving the connection string as env variables.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pg-rotate-demo
  namespace: pg-rotate-demo
  labels: { app: pg-rotate-demo }
spec:
  replicas: 1
  selector:
    matchLabels: { app: pg-rotate-demo }
  template:
    metadata:
      labels: { app: pg-rotate-demo }
    spec:
      serviceAccountName: pg-rotate
      containers:
        - name: alpine
          image: alpine:3.23
          # At startup: logs the DSN (password masked) to prove the injection, then sleeps.
          command:
            - sh
            - -c
            - |
              echo "[pg-rotate-demo] démarré $(date -u +%H:%M:%S) — DSN injectée :"
              echo "  DATABASE_URL=$(echo "$DATABASE_URL" | sed 's/:[^:@]*@/:****@/')"
              echo "  PGUSER=$PGUSER PGDATABASE=$PGDATABASE PGHOST=$PGHOST"
              exec sleep infinity
          envFrom:
            - secretRef:
                name: pg-rotate-creds     # DATABASE_URL / PGHOST / PGPORT / PGDATABASE / PGUSER / PGPASSWORD
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 48Mi }
