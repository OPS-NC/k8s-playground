# 01-keycloak-client.yaml — the `dex` OIDC client INSIDE Keycloak, declared as a CR.
#
# Up to Keycloak 26.7, creating a client from the outside meant a `kcadm.sh` script, an admin
# token, and state that nothing reconciles. The `KeycloakOIDCClient` CRD replaces all of that
# — the operator creates the client in the realm and keeps it conformant to this object. It is
# the client-side counterpart of what `KeycloakRealmImport` does for the realm.
#
# ⚠️ There is NO `clientId` field: `metadata.name` carries it. That name must therefore equal
#    the `clientID` of the Dex configuration (values.yaml) exactly.
#
# The CR lives in the `keycloak` namespace and not in `dex`: the operator only watches its own
# namespace (`JOSDK_WATCH_CURRENT`), and `keycloakCRName` refers to a `Keycloak` CR "in the
# same namespace". The Secret referenced below must therefore exist THERE TOO — hence the same
# Secret created in both namespaces by `dex-up.sh` (Secrets do not cross namespaces).
apiVersion: k8s.keycloak.org/v2alpha1
kind: KeycloakOIDCClient
metadata:
  name: dex
  namespace: keycloak
spec:
  keycloakCRName: keycloak
  realm: lab
  client:
    displayName: Dex (the lab's OIDC broker)
    description: Confidential client used by Dex to federate the lab realm
    enabled: true
    # STANDARD = the authorization code flow, the only one Dex needs. We enable neither
    # DIRECT_GRANT (the password is sent to the server, to be avoided), nor SERVICE_ACCOUNT,
    # nor IMPLICIT (obsolete): an OIDC client should only expose the flow it uses.
    loginFlows:
      - STANDARD
    # The ONLY URL Keycloak will agree to send the browser back to. No wildcard: a `*` here
    # turns the client into an open relay (authorization code theft).
    redirectUris:
      - https://dex.lab.example.io/callback
    auth:
      method: client-secret
      # The secret is generated by `dex-up.sh` (openssl) and only exists in this Secret;
      # Keycloak reads it here, Dex reads its own in the `dex` namespace. Nothing in git.
      secretRef:
        name: dex-keycloak-client
        key: client-secret
