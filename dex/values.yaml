# values.yaml — Dex for the Talos / kubeadm labs (dexidp/dex chart).
#
# DEX'S ROLE HERE. The Kubernetes API server only knows how to talk to ONE OIDC issuer, and
# only to read tokens: it does no federation, no claim mapping, no client rotation. Dex is that
# single point — a broker: it presents itself to the apiserver as the issuer
# `https://dex.lab.example.io`, and goes looking for the identity in Keycloak itself. Adding a
# second directory tomorrow (LDAP, GitHub) is one more connector, with no change to the control
# plane.
#
# Exposure principle, as everywhere in this repository: TLS is terminated by **Envoy Gateway**
# (the `*.lab.example.io` wildcard) and Dex runs IN PLAINTEXT behind it (`https.enabled: false`,
# the chart default). The `issuer` stays the PUBLIC URL: that is the value signed into the
# tokens and verified by the apiserver.

# A single replica: Dex is stateless here (storage in the Kubernetes API, see below), but 2
# replicas would require a properly shared `refresh token` — pointless in a lab.
replicaCount: 1

# Neither the Keycloak client secret nor the `kubernetes` client secret appears in this
# configuration: Dex expands the environment variables of its config file at startup. The
# values therefore come from Secrets, generated by `dex-up.sh`.
envVars:
  - name: KEYCLOAK_CLIENT_SECRET
    valueFrom:
      secretKeyRef:
        name: dex-keycloak-client
        key: client-secret
  - name: KUBERNETES_CLIENT_SECRET
    valueFrom:
      secretKeyRef:
        name: dex-kubernetes-client
        key: client-secret

config:
  # The PUBLIC URL. It must be identical in three places: here, in the `hostnames:` of the
  # HTTPRoute, and in the apiserver's `--oidc-issuer-url`. The slightest discrepancy (a
  # trailing `/`, `http` instead of `https`) and the apiserver rejects every token with an
  # "oidc: id token issued by a different provider".
  issuer: https://dex.lab.example.io

  # Storage in the Kubernetes API (CRDs created by Dex at startup): no database to operate,
  # and the sessions survive a pod restart. The chart lays down the matching RBAC
  # (`rbac.create`).
  storage:
    type: kubernetes
    config:
      inCluster: true

  # Dex listens in plaintext: Envoy does the HTTPS in front. `0.0.0.0` and not `127.0.0.1`,
  # otherwise the Service reaches nothing.
  web:
    http: 0.0.0.0:5556

  oauth2:
    # Without this, every `kubectl` shows an "authorize this application?" page: consent makes
    # no sense when the client is the cluster itself.
    skipApprovalScreen: true
    # The refresh token lets kubectl renew its token without opening a browser again. Without
    # `offline_access`, you have to log in again on every expiry.
    responseTypes:
      - code

  # --- Upstream connector: Keycloak -----------------------------------------
  connectors:
    - type: oidc
      id: keycloak
      name: Keycloak
      config:
        # The REALM's issuer, not the server's: `/realms/<realm>`.
        issuer: https://keycloak.lab.example.io/realms/lab
        clientID: dex
        clientSecret: $KEYCLOAK_CLIENT_SECRET
        redirectURI: https://dex.lab.example.io/callback
        # `groups` must be requested EXPLICITLY: it is not a standard scope, and without it the
        # token carries no membership — so no RBAC applies (see the `groups` client scope
        # declared in ../keycloak/03-realm-lab.yaml).
        scopes:
          - openid
          - profile
          - email
          - groups
        # Copies the `groups` claim of the Keycloak token into the token Dex issues.
        # Without `insecureEnableGroups`, Dex's generic OIDC connector IGNORES the upstream
        # groups — the classic silent failure of this setup.
        insecureEnableGroups: true
        # `getUserInfo` fetches the claims from the userinfo endpoint rather than settling for
        # the id_token: Keycloak does not always put everything in there.
        getUserInfo: true
        # A readable username (`demo`) rather than Keycloak's `sub` UUID. The apiserver's
        # `--oidc-username-claim` stays `email`: that is the field which becomes the Kubernetes
        # identity, see the README.
        userNameKey: preferred_username
        # ⚠️ WITHOUT THIS, DEX CRASHLOOPS ON EVERY LAB THAT IS NOT ON LET'S ENCRYPT PROD.
        #    At startup Dex fetches `<issuer>/.well-known/openid-configuration` from Keycloak
        #    over HTTPS, and a failure there is FATAL — not a retry:
        #        failed to initialize server: server: Failed to open connector keycloak:
        #        [...] tls: failed to verify certificate: x509: certificate signed by
        #        unknown authority
        #    Keycloak is served by Envoy with the lab's `*.<LAB_DOMAIN>` wildcard, which is
        #    signed by a local CA (`SELF_SIGNED=true`, the repo default) or by the Let's
        #    Encrypt STAGING chain (`LAB_ACME_ISSUER=staging`, the documented default). Neither
        #    is in the container's trust store, so the discovery cannot be verified.
        #    The rest of the component was only ever tested against LE production, where the
        #    system store happens to be enough — which is why the whole README talks at length
        #    about who must trust DEX, and never about Dex trusting KEYCLOAK.
        #
        #    `rootCAs` REPLACES the system pool rather than adding to it, and that is fine in
        #    all three modes: the `tls.crt` of the wildcard Secret always carries its own
        #    anchor — leaf + local CA in self-signed mode (see ../self-signed/selfsigned-up.sh,
        #    which concatenates them on purpose), leaf + intermediate (+ root) with ACME. The
        #    file is the copy of that Secret which `dex-up.sh` places in this namespace.
        #
        #    Do NOT swap this for `insecureSkipVerify: true`: it would work, and it teaches the
        #    wrong reflex on the one component whose whole job is to validate identities.
        rootCAs:
          - /etc/dex-ca/ca.crt

  # --- Downstream client: kubectl --------------------------------------------
  staticClients:
    - id: kubernetes
      name: Kubernetes (kubectl oidc-login)
      secret: $KUBERNETES_CLIENT_SECRET
      # kubelogin (`kubectl oidc-login`) opens a browser and listens locally on 8000: these two
      # URLs are the only valid ones. They stay `http` and on loopback — the case RFC 8252
      # foresees for a native application.
      redirectURIs:
        - http://localhost:8000
        - http://127.0.0.1:8000

# The lab CA that the `keycloak` connector above validates the discovery against. The Secret is
# a copy of the wildcard `tls.crt`, placed in this namespace by `dex-up.sh`: a Secret does not
# cross namespaces, and the original lives in `envoy-gateway-system`.
# Mounted OUTSIDE `/etc/dex`: the chart already mounts the rendered configuration there, and a
# second volume on the same path would shadow it.
volumes:
  - name: lab-ca
    secret:
      secretName: dex-lab-ca
volumeMounts:
  - name: lab-ca
    mountPath: /etc/dex-ca
    readOnly: true

# Resources: Dex is a tiny Go binary, but without a limit it would end up being the first thing
# evicted on 4 GB workers.
resources:
  requests:
    cpu: 20m
    memory: 48Mi
  limits:
    memory: 128Mi
