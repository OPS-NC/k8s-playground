# rbac.yaml — what gives the Keycloak groups their MEANING.
#
# Kubernetes has no users: it has strings the authenticator hands it. After the
# Keycloak → Dex → apiserver chain, the user `demo`, member of the `k8s-admins` group, arrives
# here as:
#
#     user   = oidc:demo@lab.example.io      (the `email` claim, prefixed)
#     groups = [oidc:k8s-admins]             (the `groups` claim, prefixed)
#
# The `oidc:` prefix comes from `--oidc-username-prefix` / `--oidc-groups-prefix` set on the
# apiserver (see apiserver-oidc.talos.yaml / apiserver-oidc.kubeadm.yaml). It is NOT
# decorative: without it, a directory declaring a `system:masters` group or a
# `system:kube-scheduler` user would impersonate an internal cluster identity. Every RBAC
# binding must therefore carry that prefix — and if you change the prefix, change it here.
#
# Two levels only, on purpose: `cluster-admin` for the demonstration, `view` to show that the
# same OIDC setup also grants READ access without handing out a single client certificate.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: oidc-k8s-admins
  labels:
    app.kubernetes.io/part-of: dex
subjects:
  # `kind: Group` and not `User`: it is membership that grants the right, not the person.
  # Adding somebody is done in Keycloak, never with kubectl.
  - kind: Group
    name: oidc:k8s-admins
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: oidc-k8s-viewers
  labels:
    app.kubernetes.io/part-of: dex
subjects:
  - kind: Group
    name: oidc:k8s-viewers
    apiGroup: rbac.authorization.k8s.io
roleRef:
  # `view` is a built-in ClusterRole: read-only on most resources of a namespace, BUT it
  # grants access neither to Secrets nor to cluster-scoped resources.
  kind: ClusterRole
  name: view
  apiGroup: rbac.authorization.k8s.io
