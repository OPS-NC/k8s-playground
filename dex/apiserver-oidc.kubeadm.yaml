# apiserver-oidc.kubeadm.yaml — a kubeadm `ClusterConfiguration` fragment: wires the API
# server's OIDC authentication to Dex.
#
# ⚠️ THIS FILE IS NOT APPLIED WITH `kubectl`. On a kubeadm lab the kube-apiserver is a STATIC
#    POD: its manifest is a file on each control plane's disk
#    (`/etc/kubernetes/manifests/kube-apiserver.yaml`), regenerated by `kubeadm` from the
#    `kubeadm-config` ConfigMap. The complete procedure — merge this fragment into the
#    ConfigMap, then regenerate the manifest on every control plane — is in the README
#    ("Wiring the API server" section).
#
# WHY GO THROUGH THE ConfigMap rather than editing the manifest by hand: a `kubeadm upgrade`
# regenerates the manifest from `kubeadm-config` and would silently overwrite a manual edit.
# The ConfigMap is the source of truth.
#
# 🔏 `SELF_SIGNED=true` CASE (the repository default): additionally add
#    `{name: oidc-ca-file, value: /etc/kubernetes/pki/oidc-ca.crt}` and drop the lab CA at that
#    path on every control plane. `/etc/kubernetes/pki` is ALREADY mounted into the static pod:
#    no volume to add — that is the pleasant flip side of an ordinary filesystem (on Talos, an
#    `extraVolumes` is required).
apiServer:
  # kubeadm v1beta4 (Kubernetes ≥ 1.31): `extraArgs` is a LIST of {name, value}. On earlier
  # versions it was a map — and on Talos it still is one (see apiserver-oidc.talos.yaml). The
  # same setting, two shapes.
  extraArgs:
    # The expected issuer. Must equal Dex's `config.issuer` and its HTTPRoute hostname
    # EXACTLY — otherwise "oidc: id token issued by a different provider".
    - name: oidc-issuer-url
      value: https://dex.lab.example.io
    # The expected audience: the `id` of the static client declared in dex/values.yaml.
    - name: oidc-client-id
      value: kubernetes
    # The claim that becomes the Kubernetes identity. `email` and not `sub`: a UUID says
    # nothing in a `kubectl auth can-i --as=...` nor in an audit log.
    - name: oidc-username-claim
      value: email
    # Prefixes: they isolate OIDC identities from the cluster's own. Without them, a directory
    # declaring the `system:masters` group gets full powers.
    # They must match the subjects of the ClusterRoleBindings in `rbac.yaml`.
    - name: oidc-username-prefix
      value: "oidc:"
    - name: oidc-groups-claim
      value: groups
    - name: oidc-groups-prefix
      value: "oidc:"
