# Exposes Dex (OIDC endpoints + the connector selection page) over HTTPS at
# `dex.lab.example.io`, behind `main-gateway` (Envoy Gateway). TLS is the `*.lab.example.io`
# wildcard already carried by the `https` listener — no Certificate to create.
#
# The route lives in the `dex` namespace but attaches to the Gateway of the
# `envoy-gateway-system` namespace: possible because `main-gateway` opens its listeners to
# `from: All`. Backend in the same namespace as the route → no ReferenceGrant.
#
# ⚠️ This hostname is Dex's `issuer`. It must be identical, character for character, to
#    `config.issuer` (values.yaml) and to the apiserver's `--oidc-issuer-url`. It is the value
#    signed into every token: any discrepancy and the apiserver rejects all of them.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dex
  namespace: dex
spec:
  parentRefs:
    - name: main-gateway
      namespace: envoy-gateway-system
      sectionName: https          # targets the TLS :443 listener
  hostnames:
    - dex.lab.example.io         # matches the *.lab.example.io wildcard
  rules:
    - backendRefs:
        # Dex listens in plaintext on 5556 (`https.enabled: false`): Envoy does the HTTPS.
        - name: dex
          port: 5556
