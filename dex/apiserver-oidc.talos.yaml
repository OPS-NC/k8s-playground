# apiserver-oidc.talos.yaml — a Talos machine-configuration patch: wires the API server's
# OIDC authentication to Dex.
#
#   talosctl -n <IP of a control plane> patch mc --patch @dex/apiserver-oidc.talos.yaml
#
# To be applied on EVERY control plane. Talos rewrites the kube-apiserver static manifest and
# restarts it on its own — no file to edit, no SSH: the machine configuration IS the API. That
# is the whole difference with the kubeadm lab, where the same setting lives in a file on the
# node's disk (see `apiserver-oidc.kubeadm.yaml`).
#
# ⚠️ THIS PATCH RESTARTS THE API SERVER. An unreachable `oidc-issuer-url` or an untrusted
#    certificate and the apiserver refuses to start: the cluster becomes unadministrable until
#    the patch is undone. Apply it one control plane at a time, checking
#    `kubectl get --raw=/readyz` in between.
#
# ⚠️ NONE of these settings removes anything: the existing client certificates (the lab's
#    `kubeconfig`, the components' own) keep working. OIDC is ADDED to the authenticators, it
#    does not replace them — that is what makes the operation reversible.
#
# 🔏 `SELF_SIGNED=true` CASE (the repository default): the apiserver must additionally trust
#    the local CA that signs `dex.lab.example.io`. An `oidc-ca-file`, the volume that exposes
#    it and the file itself must then be ADDED — the complete, ready-to-paste procedure is in
#    the README ("Wiring the API server" section).
cluster:
  apiServer:
    # Talos v1alpha1: `extraArgs` is a MAP (key -> value), without the leading `--`.
    # The kubeadm lab, for its part, is on kubeadm v1beta4 where it is a LIST of {name, value}:
    # the same setting, two shapes.
    extraArgs:
      # The expected issuer. Must equal Dex's `config.issuer` and its HTTPRoute hostname
      # EXACTLY — otherwise "oidc: id token issued by a different provider".
      # ⚠️ `lab.example.io` is the repository's NEUTRAL placeholder and NOTHING substitutes it
      #    here: unlike the manifests `dex-up.sh` applies, this patch is passed to
      #    `talosctl patch mc` BY HAND. Replace it with your own LAB_DOMAIN — see README.md.
      oidc-issuer-url: https://dex.lab.example.io
      # The expected audience: the `id` of the static client declared in dex/values.yaml.
      oidc-client-id: kubernetes
      # The claim that becomes the Kubernetes identity. `email` and not `sub`: a UUID says
      # nothing in a `kubectl auth can-i --as=...` nor in an audit log.
      oidc-username-claim: email
      # Prefixes: they isolate OIDC identities from the cluster's own. Without them, a
      # directory declaring the `system:masters` group gets full powers.
      # They must match the subjects of the ClusterRoleBindings in `rbac.yaml`.
      oidc-username-prefix: "oidc:"
      oidc-groups-claim: groups
      oidc-groups-prefix: "oidc:"
