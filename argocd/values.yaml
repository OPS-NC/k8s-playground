# values.yaml — Argo CD for the Talos / kubeadm labs (argo/argo-cd chart).
#
# Exposure principle: TLS is terminated by **Envoy Gateway** (the `*.lab.example.io` wildcard
# cert supplied by cert-manager). argocd-server therefore runs IN PLAINTEXT
# (`server.insecure=true`): Envoy does the HTTPS in front, HTTP behind. Without it,
# argocd-server would issue its own 307 http->https redirect => an infinite loop behind a
# proxy that already terminates TLS.

global:
  # External domain: serves as the base URL AND as the host of the route/UI.
  domain: argo.lab.example.io

configs:
  params:
    # Internal HTTP — HTTPS is handled by the Gateway (see httproute.yaml).
    server.insecure: true
  cm:
    # Public URL (generated links, callbacks). Derived from global.domain, spelled out here.
    url: https://argo.lab.example.io

# Single-user lab: no SSO → Dex turned off (one pod less on 2 GB nodes).
# Authentication uses the local admin (initial password in a Secret, see the README).
dex:
  enabled: false

# Turned off to keep things light; re-enable it if you want notifications (Slack, etc.).
notifications:
  enabled: false

# ApplicationSet left enabled (GitOps generators) — a lightweight controller.
# redis as a single instance (the chart default, non-HA): enough for the lab.
