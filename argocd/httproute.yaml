# Exposes Argo CD's UI (and its API/gRPC-web) through the Gateway API, over HTTPS, at
# `argo.lab.example.io`. The certificate is the `*.lab.example.io` wildcard already carried by
# the `https` listener of `main-gateway` (cert-manager) — NO new Certificate is needed, the
# wildcard covers `argo.lab.example.io`.
#
# The route lives in the `argocd` namespace but attaches to the Gateway of the
# `envoy-gateway-system` namespace: possible because `main-gateway` opens its listeners to
# `from: All`. The `argocd-server` backend is in the same namespace as the route → no
# ReferenceGrant to create.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-server
  namespace: argocd
spec:
  parentRefs:
    - name: main-gateway
      namespace: envoy-gateway-system
      sectionName: https          # targets the TLS :443 listener
  hostnames:
    - argo.lab.example.io        # matches the *.lab.example.io wildcard
  rules:
    - backendRefs:
        # server.insecure=true => the http port (80) serves the UI + gRPC-web in plaintext.
        - name: argocd-server
          port: 80
