# Exposes the Vault UI + API over HTTPS at `vault.lab.example.io` through Envoy Gateway.
# NEUTRAL domain (public repository): this file is applied BY HAND, so edit the hostname or go
# through `sed 's/lab\.example\.io/<your-domain>/g' … | kubectl apply -f -`.
# Cert = the `*.lab.example.io` wildcard carried by the `https` listener of main-gateway
# (cert-manager) — no dedicated Certificate.
#
# Backend = the `vault-active` service: only the ACTIVE Vault node (the leader) is routed to,
# which avoids the 307 redirects of the standbys. That service only has endpoints once Vault
# is initialised AND unsealed.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vault
  namespace: vault
spec:
  parentRefs:
    - name: main-gateway
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - vault.lab.example.io
  rules:
    - backendRefs:
        - name: vault-active
          port: 8200
