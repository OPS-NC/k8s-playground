# values.yaml — HashiCorp Vault in HA (integrated Raft) on the Talos / kubeadm labs.
# hashicorp/vault chart 0.34.0 (Vault 2.0.3). Namespace: vault (aligned with VSO:
# http://vault.vault.svc.cluster.local:8200).
#
# - Storage: integrated Raft, one 2Gi Longhorn PVC per replica (RWO).
# - TLS: terminated by Envoy Gateway (wildcard cert) → Vault listens over HTTP internally
#   (tls_disable). VSO connects to it over http through the ClusterIP service.
# - disable_mlock=true: safe on both labs (Talos has no swap; kubeadm requires swap to be off,
#   and kubeadm/provision.sh disables then masks it) and avoids requiring IPC_LOCK.
# - injector disabled: we use the Vault Secrets Operator (VSO), not the sidecars.
global:
  enabled: true
  tlsDisable: true

injector:
  enabled: false

ui:
  enabled: true
  serviceType: ClusterIP          # exposed through an HTTPRoute, no LoadBalancer

server:
  dataStorage:
    enabled: true
    size: 2Gi
    storageClass: longhorn
    accessMode: ReadWriteOnce
  auditStorage:
    enabled: false

  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi

  # Spreads the 3 replicas onto distinct nodes (the chart default, spelled out).
  affinity: |
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/name: {{ template "vault.name" . }}
              component: server
          topologyKey: kubernetes.io/hostname

  ha:
    enabled: true
    replicas: 3
    raft:
      enabled: true
      setNodeId: true
      config: |
        ui = true
        disable_mlock = true

        listener "tcp" {
          address       = "[::]:8200"
          cluster_address = "[::]:8201"
          tls_disable   = 1
        }

        storage "raft" {
          path = "/vault/data"
          retry_join { leader_api_addr = "http://vault-0.vault-internal:8200" }
          retry_join { leader_api_addr = "http://vault-1.vault-internal:8200" }
          retry_join { leader_api_addr = "http://vault-2.vault-internal:8200" }
        }

        service_registration "kubernetes" {}
