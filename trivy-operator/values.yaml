# values.yaml — Trivy Operator for the Talos / kubeadm labs (aqua/trivy-operator chart).
#
# Trivy Operator scans the cluster CONTINUOUSLY and produces report CRDs:
#   - VulnerabilityReport     (CVEs in the images)
#   - ConfigAuditReport       (bad workload configuration)
#   - ExposedSecretReport     (plaintext secrets inside the images)
#   - RbacAssessmentReport    (over-permissive RBAC)
#   - ClusterComplianceReport (CIS / NSA…)
#
# Those reports are NOT wgpolicyk8s PolicyReports: it is Policy Reporter's **trivy plugin**
# (enabled in ../kyverno/policy-reporter-values.yaml) that surfaces them in the SAME UI as
# Kyverno. One single security dashboard for the whole lab.
#
# "Lab" choices: we limit the concurrency of the scan jobs (each job is a pod that pulls the
# image + the CVE database) so as not to saturate modest nodes, and we cut the noise (only
# fixable HIGH/CRITICAL CVEs).

operator:
  # A single scan job at a time (default 10): no parallelism, the scans are serialised →
  # CPU/RAM load spread out, never a spike on the lab.
  scanJobsConcurrentLimit: 1
  # Re-scan cadence: a report older than this TTL is re-evaluated. At 30 min, every workload
  # is re-scanned roughly every 30 min (in waves, one scan at a time), then the operator sits
  # idle in between — so NO constant scanning.
  scannerReportTTL: "30m"

  # ⚠️ VALUES DRIVEN BY THE DISTRIBUTION PROFILE.
  # `trivy-operator-up.sh` overrides these two keys with `TRIVY_NODE_COLLECTOR`
  # (lib/profiles/): what is written here is the kubeadm case.
  #
  # Both "node" scanners go through a `node-collector` pod that bind-mounts /etc/systemd,
  # /lib/systemd, /etc/kubernetes…:
  #   - kubeadm/Debian 13: those paths exist and are readable => `true`, nothing to work
  #     around. The pod needs hostPID + hostPaths: it is NOT admissible under PodSecurity
  #     `baseline`/`restricted`, but kubeadm enforces no level cluster-wide by default, so it
  #     goes through as is. If you harden admission:
  #       kubectl label ns trivy-system pod-security.kubernetes.io/enforce=privileged
  #   - Talos: no systemd, / and /etc READ-ONLY => `CreateContainerError: mkdir /etc/systemd:
  #     read-only file system` (and a PodSecurity `baseline` refusal before that) => the
  #     profile sets `false`. We lose the "node" reports (infra assessment + cluster
  #     compliance); the image/config/secret/RBAC scans carry on as usual.
  # /!\ Cost on kubeadm: one collector pod per node on every cycle. On very modest VMs,
  # `TRIVY_NODE_COLLECTOR=false` remains a legitimate trade-off.
  infraAssessmentScannerEnabled: true
  clusterComplianceEnabled: true

trivy:
  # Standalone mode: each job embeds its own scan (simple). For a large cluster, prefer
  # `builtInTrivyServer: true` (a shared trivy server keeps the CVE database cached).
  mode: Standalone
  # Only show CVEs for which a fix exists (cuts the noise during training).
  ignoreUnfixed: true
  # We focus on what matters for a demo.
  severity: "HIGH,CRITICAL"

# Prometheus ServiceMonitor: DISABLED until kube-prometheus-stack is installed (otherwise the
# ServiceMonitor CRD does not exist → the helm apply fails). Switch it to true afterwards.
serviceMonitor:
  enabled: false
